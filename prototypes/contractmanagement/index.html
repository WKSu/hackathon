<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard contractmanagement</title>
<style>
:root {
  color-scheme: light;
  --page: #f4f4f1; --surface: #ffffff; --surface-2: #f0efec;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #77756f;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.12);
  --brand: #00811f; --brand-soft: #e3f2e6;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --nodata: #b5b3ad;
  --lamp-off: #3a3c40; --housing: #1d1f22;
  --series: #2a78d6; --series-soft: #dcebfd;
  --board: #121417; --board-ink: #f5c542; --board-ink-2: #e8e6df; --board-line: #2a2d32;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.05);
  --radius: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--series); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
.fout { background: #fde8e8; color: #8a1c1c; padding: 10px 12px; border-radius: 8px; }

/* Header */
.top { background: var(--surface); border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-top: 14px; padding-bottom: 14px; }
.brandmark { width: 8px; align-self: stretch; background: var(--brand); border-radius: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--brand); font-weight: 600; }
h1 { font-size: 22px; margin: 0; line-height: 1.2; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); border: 1px solid color-mix(in srgb, var(--brand) 35%, transparent); }
.top .meta { color: var(--ink-2); font-size: 12.5px; }
.top .meta a { font-weight: 600; margin-right: 10px; text-decoration: none; }
.top .meta a:hover { text-decoration: underline; }
.top .spacer { flex: 1; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }

/* Filters */
.filters { background: var(--surface); border-bottom: 1px solid var(--border); }
.filters .wrap { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-top: 10px; padding-bottom: 10px; }
.filters-meer { border-top: 1px solid var(--grid); }
.field { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.field select, .field input[type=date], .field input[type=search] { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: var(--surface); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.rolhint { color: var(--ink-2); font-size: 12.5px; }

/* Tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-top: 14px; }
.tab { border: 0; background: transparent; padding: 9px 14px; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--ink-2); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.tab .n { font-weight: 600; color: #fff; background: var(--crit); border-radius: 999px; padding: 0 7px; font-size: 11.5px; margin-left: 4px; }
.tab .n.grijs { background: var(--surface-2); color: var(--ink-2); }
main { padding: 16px 0 48px; }
.scope { color: var(--ink-2); margin: 0 0 12px; font-size: 13px; }
.scope b { color: var(--ink); }

/* Cards & grid */
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g75 { grid-template-columns: minmax(0,7fr) minmax(0,5fr); }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (max-width: 980px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g75, .g2 { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .g4 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card .lead { color: var(--ink-2); font-size: 12.5px; margin: 0 0 12px; }
.mt16 { margin-top: 16px; }
.note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
.muted { color: var(--muted); }
.laat { color: var(--crit) !important; font-weight: 600; }

/* Intro */
.intro { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; border-left: 4px solid var(--brand); margin-bottom: 16px; }
.intro ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 3px; font-size: 13.5px; }

/* Headline + tiles */
.headline { font-size: 17px; margin: 0 0 14px; max-width: 1000px; }
.headline .link { font-size: 17px; }
.tile { display: flex; flex-direction: column; gap: 2px; }
button.tile { text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; }
button.tile:hover { border-color: var(--axis); }
button.tile[aria-expanded="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tile-head { display: flex; justify-content: space-between; align-items: flex-start; }
.tile .h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.tile .big { font-size: 34px; font-weight: 700; line-height: 1.1; margin-top: 2px; }
.tile .sub { color: var(--ink); font-size: 13px; }
.tile .sub2 { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.tile .meer { margin-top: auto; padding-top: 10px; color: var(--series); font-weight: 600; font-size: 13px; }
.vri-wrap { display: inline-flex; align-items: center; gap: 8px; }
.vri { display: inline-flex; flex-direction: column; gap: 4px; background: var(--housing); padding: 5px; border-radius: 9px; }
.vri i { width: 13px; height: 13px; border-radius: 50%; background: var(--lamp-off); display: block; }
.vri i.r.on { background: var(--crit); box-shadow: 0 0 9px var(--crit); }
.vri i.y.on { background: var(--warn); box-shadow: 0 0 9px var(--warn); }
.vri i.g.on { background: var(--good); box-shadow: 0 0 9px var(--good); }
.vri-label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; background: var(--nodata); }
.dot.rood { background: var(--crit); } .dot.geel { background: var(--warn); } .dot.groen { background: var(--good); } .dot.inactief { background: transparent; border: 2px solid var(--nodata); }
.pill { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; vertical-align: 1px; white-space: nowrap; }
.pill.rood { background: var(--crit); color: #fff; } .pill.geel { background: var(--warn); color: #0b0b0b; } .pill.info { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); } .pill.groen { background: var(--good); color: #fff; } .pill.blauw { background: var(--series-soft); color: #1c5cab; }
.link { border: 0; background: none; color: var(--series); padding: 0; cursor: pointer; font-weight: 600; font-size: 13px; text-align: left; }
.link:hover { text-decoration: underline; }
.panel h2 { font-size: 16px; margin-bottom: 10px; }
.h3s { font-size: 12px; margin: 0 0 8px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }

/* Lists */
.summary { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.summary li { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: baseline; }
.advies { margin: 14px 0 0; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; }
.advies h3 { margin: 0 0 6px; font-size: 13px; }
.advies ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.bron { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
.acties { list-style: none; margin: 8px 0 0; padding: 0; }
.acties li { padding: 9px 0; border-top: 1px solid var(--grid); cursor: pointer; display: grid; grid-template-columns: 18px 1fr; gap: 3px 6px; }
.acties li:hover .t { text-decoration: underline; }
.acties .t { font-weight: 600; }
.acties .s { grid-column: 2; color: var(--ink-2); font-size: 12.5px; }

/* Departure board */
.board { background: var(--board); color: var(--board-ink-2); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.board h2 { color: var(--board-ink); font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
.board .lead { color: #9a9a92; font-size: 12px; margin: 0 0 8px; }
.board table { width: 100%; border-collapse: collapse; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.board th { text-align: left; color: #9a9a92; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; border-bottom: 1px solid var(--board-line); }
.board td { padding: 7px 6px; border-bottom: 1px solid var(--board-line); vertical-align: top; }
.board tr[data-nr], .board tr[data-goto] { cursor: pointer; }
.board tr[data-nr]:hover td, .board tr[data-goto]:hover td { background: #1c1f24; }
.board .t { color: var(--board-ink); font-weight: 700; white-space: nowrap; }
.board .naam { color: #fff; }
.board .naam small { display: block; color: #8d8d86; font-size: 11px; }
.board .opm { white-space: nowrap; font-weight: 700; }
.board .opm.rood { color: #ff6b6b; } .board .opm.geel { color: var(--board-ink); } .board .opm.groen { color: #5ad15a; }
.board .blink { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .board .blink { animation: none; } }

/* Chart */
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin: 0 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
svg text { fill: var(--muted); font-size: 11px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .baseline { stroke: var(--axis); stroke-width: 1; }
svg .marker { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg .marker-label { fill: var(--ink-2); font-weight: 600; }
svg .hit { fill: transparent; }
svg .hit:hover { fill: color-mix(in srgb, var(--ink) 6%, transparent); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); padding: 8px 10px; border-radius: 8px; font-size: 12px; white-space: pre-line; max-width: 340px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

/* Missing data */
.mist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.mist li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 13px; }
.mist .k { font-weight: 600; }
.mist .u { color: var(--ink-2); font-size: 12.5px; }
.mist .ico { color: var(--muted); font-weight: 700; }

/* Tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
.tbl th[data-sort] { cursor: pointer; }
.tbl th[data-sort]:hover { color: var(--ink); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl small { display: block; color: var(--muted); font-size: 11.5px; }
.tbl-scroll { overflow: auto; max-height: 68vh; border-radius: 8px; }
.tbl.compact .opt { display: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
.toolbar .count { color: var(--ink-2); font-size: 13px; margin-left: auto; }
.inbar { display: flex; align-items: center; gap: 8px; }
.inbar .b { height: 10px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
.tbar { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 84px; gap: 8px; align-items: center; margin: 7px 0; cursor: pointer; font-size: 13px; }
.tbar:hover .tl { text-decoration: underline; }
.tbar .b { display: block; height: 10px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
.tbar .num { text-align: right; font-variant-numeric: tabular-nums; }

/* Action list */
.grp { font-size: 14px; margin: 20px 0 4px; display: flex; gap: 6px; align-items: baseline; }
.grp.eerste { margin-top: 4px; }
.grp.telaat { color: var(--crit); }
.grp span { color: var(--muted); font-weight: 500; }
select.stat { border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; background: var(--surface); font-size: 12.5px; cursor: pointer; }
select.stat.bezig { background: var(--series-soft); }
select.stat.klaar { background: color-mix(in srgb, var(--good) 18%, var(--surface)); }
.acties-tbl td:first-child { width: 58px; }
.acties-tbl td:nth-child(3) { width: 170px; }
.acties-tbl td:nth-child(4) { width: 150px; }
.acties-tbl td:nth-child(5) { width: 110px; }

/* Theme cards */
.kansen { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.kans { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.kans h3 { margin: 0 0 4px; font-size: 13.5px; }
.kans p { margin: 0 0 6px; font-size: 12.5px; color: var(--ink-2); }
.kans ul { margin: 0; padding-left: 16px; font-size: 12.5px; }
.kans li { cursor: pointer; }
.kans li:hover { text-decoration: underline; }

/* Workload */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.cap { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; margin-bottom: 8px; }
.cap .k { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.cap b { font-size: 22px; }
@media (max-width: 760px) { .cap { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.werk { display: grid; grid-template-columns: minmax(130px, 190px) minmax(0, 1fr) minmax(260px, 340px) 80px; gap: 6px 12px; align-items: center; font-size: 13px; margin-top: 14px; }
.werk .h { font-size: 12px; color: var(--ink-2); font-weight: 600; border-bottom: 1px solid var(--axis); padding-bottom: 6px; }
.werk .nm { cursor: pointer; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.werk .nm:hover { text-decoration: underline; }
.werk .track { position: relative; height: 18px; }
.werk .bar { position: absolute; left: 0; top: 4px; height: 10px; background: var(--series); border-radius: 0 4px 4px 0; }
.werk .bar.over { background: var(--crit); }
.werk .bar.leeg { background: repeating-linear-gradient(135deg, var(--nodata) 0 3px, transparent 3px 6px); border: 1px solid var(--nodata); }
.werk .norm { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px dashed var(--ink-2); }
.werk .info { color: var(--ink-2); font-size: 12.5px; }
.werk .info b { color: var(--ink); }
.werk label { font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.werk-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 10px 0 0; }
.werk-legend i { display: inline-block; width: 14px; height: 0; border-top: 2px dashed var(--ink-2); vertical-align: middle; margin-right: 6px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--surface); z-index: 40; box-shadow: -10px 0 30px rgba(0,0,0,.18); transform: translateX(105%); transition: transform .2s ease; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer-inner { padding: 20px 22px 40px; }
.drawer h2 { margin: 2px 0 4px; font-size: 20px; }
.drawer h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 22px 0 8px; }
.drawer .close { position: sticky; top: 0; float: right; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 16px; margin-top: 14px; }
.kv div { font-size: 13px; }
.kv .k { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.rollen { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
@media (max-width: 520px) { .rollen { grid-template-columns: 1fr; } }
.rol { border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; }
.rol span { display: block; color: var(--muted); font-size: 11.5px; }
.rol.leeg { border: 2px dashed var(--crit); color: var(--crit); font-weight: 600; }
.rol .tag { display: inline-block; margin-top: 6px; font-size: 11px; background: var(--surface-2); border-radius: 4px; padding: 1px 6px; color: var(--ink-2); }
.acts { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.acts li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: 13px; align-items: start; }
.acts li.klaar { opacity: .55; }
.acts li.klaar b { text-decoration: line-through; }
.acts .pill { justify-self: start; }
.acts .w { color: var(--ink-2); font-size: 12.5px; }
.acts .ctl, .ctl-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
.acts select, .ctl-row select, .ctl-row input[type=date] { border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; background: var(--surface); font-size: 12.5px; }
.acts .bronlink { font-size: 12px; }
.chg { font-weight: 700; color: var(--ink); background: color-mix(in srgb, var(--warn) 22%, transparent); }
.tram text { font-size: 11px; }
.tram .lbl { fill: var(--ink-2); }
.tram .lbl-b { fill: var(--ink); font-weight: 600; }

/* Details */
details.more > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-size: 15px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
details.more[open] > summary::before { transform: rotate(90deg); }
details.more[open] > summary { margin-bottom: 12px; }
.drawer details.more { margin-top: 24px; border-top: 1px solid var(--grid); padding-top: 14px; }
.drawer details.more > summary { color: var(--series); font-weight: 600; font-size: 14px; }

/* Dialogs */
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(660px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg { padding: 18px 20px; }
.dlg h2 { margin: 0 0 4px; font-size: 17px; }
.dlg .rows { display: grid; gap: 10px; margin: 14px 0; }
.dlg .row { display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center; }
.dlg .row small { display: block; color: var(--muted); }
.dlg input[type=number] { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; width: 100%; background: var(--surface); }
.dlg textarea { width: 100%; min-height: 360px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: var(--surface-2); }
.dlg .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* Uitleg */
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; margin: 6px 0 4px; }
.flow .stap { flex: 1 1 150px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); font-size: 12.5px; }
.flow .stap b { display: block; font-size: 13px; margin-bottom: 2px; }
.flow .pijl { align-self: center; color: var(--muted); font-size: 18px; }
.regels td:first-child { white-space: nowrap; font-weight: 600; }
.regels tbody tr { cursor: default; }
.prose p, .prose li { font-size: 13.5px; }
.prose h3 { font-size: 14px; margin: 20px 0 6px; }

<script>

/* ======================= Data & helpers ======================= */
const D = JSON.parse(document.getElementById('data').textContent);

const store = {

  set(k, v) { try { localStorage.setItem('cmdash:' + k, JSON.stringify(v)); } catch (e) { /* opslag niet beschikbaar */ } },

const DAG = 864e5;
function parseDate(s) { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
const mndTussen = (a, b) => (b - a) / (DAG * 30.4375);
function addMnd(d, n) { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; }
const eindMaand = d => new Date(d.getFullYear(), d.getMonth() + 1, 0);
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtD = d => d ? d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fmtDkort = d => d ? d.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '--';
const NF0 = new Intl.NumberFormat('nl-NL', { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat('nl-NL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const NFj = new Intl.NumberFormat('nl-NL', { maximumFractionDigits: 1 });
function eur(v) {
  if (v == null || isNaN(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e9) return '€ ' + NF1.format(v / 1e9) + ' mld';
  if (a >= 1e6) return '€ ' + NF1.format(v / 1e6) + ' mln';
  if (a >= 1e4) return '€ ' + NF0.format(v / 1e3) + 'k';
  return '€ ' + NF0.format(v);
}
const eurVol = v => (v == null || isNaN(v)) ? '—' : '€ ' + NF0.format(v);
function fmtMnd(m) { if (m < 1) return 'minder dan een maand'; if (m < 24) return Math.round(m) + ' mnd'; return NFj.format(m / 12) + ' jaar'; }
const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function groupBy(a, f) { const m = new Map(); for (const x of a) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }
const mv = n => n === 1 ? 'contract' : 'contracten';
const mvA = n => n === 1 ? 'actie' : 'acties';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ======================= Vaste begrippen ======================= */
const ROL = { ce: 'Contracteigenaar', cm: 'Contractmanager', cb: 'Contractbeheerder' };

const ROLTAAK = {

};
const NORM0 = { signaalMnd: 18, doorloopEU: 18, doorloopNat: 6, drempel: 216000, besluitMnd: 3, normCM: 20, normCB: 30, maxLooptijdMnd: 48, wijzigGrens: 10, roodAandeel: 20 };
const NORM_LABEL = {

  drempel: ['Europese drempel leveringen en diensten (€)', 'Contractwaarde geldt als schatting. Check de actuele drempel op pianoo.nl'],

};
const AW = { label: 'Aanbestedingswet 2012', url: 'https://wetten.overheid.nl/BWBR0032203' };
const BW = { label: 'Burgerlijk Wetboek boek 6', url: 'https://wetten.overheid.nl/BWBR0005289' };
const PLAN = {
  onbekend: 'Nog niets vastgelegd',

};

const STATUS = { open: 'Open', bezig: 'Opgepakt', klaar: 'Klaar' };
const OORDEEL = { '': 'Nog niet beoordeeld', goed: 'Goed', aandacht: 'Vraagt aandacht', onvoldoende: 'Onvoldoende' };

const BUCKETS = { telaat: 'Te laat', maand: 'Deze maand', kwartaal: 'Komende 3 maanden', later: 'Later' };
const LICHT = { rood: 'Rood', geel: 'Geel', groen: 'Groen', nodata: 'Geen data', inactief: 'Inactief', info: 'Info' };
const GEWENST_UITLEG = {
  'Verlengingsoptie': 'aflopend mét of zonder verlenging onderscheiden (nu met de hand per contract)',
  'Opzegtermijn': 'uiterste besluitdatum per contract in plaats van een vaste termijn',
  'Uitputting': 'stoplicht Geld: besteed vs. contractwaarde',
  'KPI-score': 'stoplicht Kwaliteit (nu met de hand per contract)',
  'Laatste voortgangsgesprek': 'signaal als het kwartaalgesprek ontbreekt',
  'Aanbestedingsprocedure': 'juiste doorlooptijd en wettoets (nu geschat uit het bedrag)',
  'Thema': 'koppelkansen per onderwerp (nu op basis van kolom Cluster)',
};

/* ======================= Contracten ======================= */
function bouwContracten(rows) {
  const out = [];
  for (const [, vs] of groupBy(rows, r => r.nr)) {
    vs.sort((a, b) => (a.versie ?? 0) - (b.versie ?? 0));
    const vast = vs.filter(v => v.vstatus !== 'Concept');
    const basis = vast.length ? vast : vs;
    const cur = basis[basis.length - 1];
    out.push({
      ...cur,
      thema: cur.cluster || 'Geen cluster',
      versies: vs, eerste: basis[0],
      prev: basis.length > 1 ? basis[basis.length - 2] : null,
      conceptOpen: vs.some(v => v.vstatus === 'Concept' && (v.versie ?? 0) > (cur.versie ?? 0)),
      startD: parseDate(cur.start), eindD: parseDate(cur.eind),
    });
  }
  return out;
}
const C = bouwContracten(D.rows);
const THEMAS = [...new Set(C.map(c => c.thema))].sort((a, b) => a.localeCompare(b, 'nl'));
const PERSONEN = [...new Set(C.flatMap(c => [c.cm, c.cb, c.ce]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'nl'));

/* ======================= State ======================= */
const state = {
  peil: parseDate(META.peildatum),
  norm: { ...NORM0, ...store.get('norm', {}) },
  vertrek: new Set(store.get('vertrek', [])),
  plan: store.get('plan', {}),
  status: store.get('status', {}),
  toewijzing: store.get('toewijzing', {}),
  kwaliteit: store.get('kwaliteit', {}),
  intro: store.get('intro', true),
  rol: 'mt', persoon: '', themas: new Set(), inactief: false,
  tab: store.get('tab', 'overzicht'),
  lijst: { zoek: '', filter: 'alle', sort: 'eind', dir: 1, breed: false },
  acties: { wie: null, soort: 'alle', status: 'open', info: false },
  werkRol: 'cm', focus: null, openSam: false, open: null,
};
const persoonView = () => state.rol !== 'mt' && !!state.persoon;

/* ======================= Acties: wat, wie, uiterlijk ======================= */
const ORDE = { rood: 0, geel: 1, info: 2 };
const isEU = c => (c.bedrag ?? 0) >= state.norm.drempel;
const doorloop = c => isEU(c) ? state.norm.doorloopEU : state.norm.doorloopNat;
function niveau(u) {
  if (!u) return 'info';
  if (u < state.peil) return 'rood';
  return u <= addMnd(state.peil, 3) ? 'geel' : 'info';
}
function wie(c, ...volgorde) {
  for (const r of volgorde) if (c[r] && !state.vertrek.has(c[r])) return { rol: r, naam: c[r] };
  return { rol: 'mt', naam: null };
}
function maakActies(c) {
  const N = state.norm, A = [];
  if (c.status !== 'Actief') return A;
  const deze = eindMaand(state.peil);
  const add = (key, cat, wat, waarom, auto, uiterlijk, lvl, bron) => {
    const id = c.nr + '|' + key;
    const over = state.toewijzing[id];
    const w = over === 'MT' ? { rol: 'mt', naam: null }
      : over ? { rol: Object.keys(ROL).find(k => c[k] === over) || null, naam: over } : auto;
    A.push({ id, key, cat, wat, waarom, auto, wie: w, uiterlijk, lvl: lvl || niveau(uiterlijk), bron, status: state.status[id] || 'open', c });
  };
  // Tijd: uiterste start = einddatum min doorlooptijd van de (geschatte) procedure
  const plan = state.plan[c.nr] || 'onbekend';
  if (!c.eindD) add('geen_eind', 'data', 'Vul de einddatum aan', 'Einddatum ontbreekt, dus looptijdsignalen zijn niet mogelijk', wie(c, 'cb', 'cm', 'ce'), deze, 'geel');
  else {
    const m = mndTussen(state.peil, c.eindD);
    if (m < 0) add('verlopen', 'tijd', 'Werk de status bij of leg de verlenging vast', `Einddatum ${fmtD(c.eindD)} is voorbij, maar het contract staat nog op Actief`, wie(c, 'cb', 'cm', 'ce'), c.eindD, 'rood');
    else if (m <= Math.max(N.signaalMnd, doorloop(c))) {
      const proc = isEU(c) ? `Europese aanbesteding duurt ± ${N.doorloopEU} mnd` : `aanbesteding onder de Europese drempel duurt ± ${N.doorloopNat} mnd`;
      if (plan === 'verlengen') add('afloop', 'tijd', 'Leg de verlenging vast (nieuwe einddatum)', `Besloten te verlengen; in het systeem staat nog einddatum ${fmtD(c.eindD)}`, wie(c, 'cb', 'cm', 'ce'), addMnd(c.eindD, -1));
      else if (plan === 'aanbesteding') add('afloop', 'tijd', 'Bewaak de planning van de (her)aanbesteding', `Nieuw contract nodig vóór ${fmtD(c.eindD)}`, wie(c, 'cm', 'ce'), c.eindD, 'info');
      else if (plan === 'beeindigen') add('afloop', 'tijd', 'Bereid de afloop voor (overdracht, eindafrekening)', `Contract stopt op ${fmtD(c.eindD)}`, wie(c, 'cm', 'ce'), c.eindD, 'info');
      else if (plan === 'optie') add('afloop', 'tijd', 'Besluit: verlengen of niet', `Verlengingsoptie aanwezig; loopt af op ${fmtD(c.eindD)}`, wie(c, 'ce', 'cm'), addMnd(c.eindD, -N.besluitMnd));
      else add('afloop', 'tijd', plan === 'geenoptie' ? 'Start de (her)aanbesteding' : 'Kies: verlengen of opnieuw aanbesteden',
        `Loopt af op ${fmtD(c.eindD)}; ${proc}${plan === 'onbekend' ? '. Verlengingsoptie is onbekend' : ''}`, wie(c, 'cm', 'ce'), addMnd(c.eindD, -doorloop(c)));
    }
  }
  // Rollen
  for (const [k, lvl] of [['ce', 'rood'], ['cm', 'rood'], ['cb', 'geel']]) {
    if (!c[k]) add('rol_' + k, 'rollen', `Wijs een ${ROL[k].toLowerCase()} toe`, `Rol ${ROL[k].toLowerCase()} is niet belegd`, k === 'ce' ? { rol: 'mt', naam: null } : wie(c, 'ce'), deze, lvl);
    else if (state.vertrek.has(c[k])) add('vertrek_' + k, 'rollen', `Regel de overdracht van ${c[k]}`, `${c[k]} (${ROL[k].toLowerCase()}) vertrekt`, k === 'ce' ? { rol: 'mt', naam: null } : wie(c, 'ce'), deze, 'geel');
  }
  if (c.cm && c.cm === c.cb) add('functiescheiding', 'rollen', 'Beleg het beheer bij een andere persoon', `${c.cm} is contractmanager én contractbeheerder (functiescheiding)`, wie(c, 'ce'), addMnd(state.peil, 3), 'geel');
  if (c.prev) for (const k of ['ce', 'cm', 'cb']) {
    if (c.prev[k] && c[k] && c.prev[k] !== c[k]) add('rolwissel_' + k, 'rollen', 'Check of de overdracht rond is', `${ROL[k]} gewisseld in versie ${c.versie}: ${c.prev[k]} → ${c[k]}`, { rol: k, naam: c[k] }, addMnd(state.peil, 1), 'info');

  if (c.bedrag == null || c.bedrag === 0) add('bedrag', 'data', 'Vul de contractwaarde aan', 'Bedrag ontbreekt of is € 0', wie(c, 'cb', 'cm', 'ce'), deze, 'info');
  else if (c.eerste && c.eerste.bedrag > 0 && c.bedrag > c.eerste.bedrag * (1 + N.wijzigGrens / 100)) {
    const p = Math.round((c.bedrag / c.eerste.bedrag - 1) * 100);
    add('wijziging', 'geld', 'Toets de waardestijging aan de Aanbestedingswet', `Waarde +${p}% t.o.v. versie ${c.eerste.versie} (${eur(c.eerste.bedrag)} → ${eur(c.bedrag)}). Grens art. 2.163b: 10% leveringen/diensten, 15% werken`, wie(c, 'cm', 'ce'), addMnd(state.peil, 3), 'geel', AW);
  }

    const lt = mndTussen(c.startD, c.eindD);
    if (lt > N.maxLooptijdMnd + 0.5) add('looptijd', 'wet', 'Leg de motivering voor de lange looptijd vast', `Raamovereenkomst van ${fmtMnd(lt)}; art. 2.140: max. 4 jaar, tenzij gemotiveerd`, wie(c, 'cm', 'ce'), addMnd(state.peil, 3), 'geel', AW);
  }
  if (c.conceptOpen) add('concept', 'data', 'Rond de conceptversie af of trek hem in', 'Er staat een conceptversie open', wie(c, 'cb', 'cm', 'ce'), deze, 'info');

function maandChart(act) {
  const N = state.norm, M = 24;
  const p0 = new Date(state.peil.getFullYear(), state.peil.getMonth(), 1);
  const klasse = c => c._open.some(a => a.cat === 'tijd' && a.lvl === 'rood') ? 'rood' : c._open.some(a => a.cat === 'tijd' && a.lvl === 'geel') ? 'geel' : 'groen';
  const B = [{ label: 'Verlopen', lang: 'Verlopen (nog actief)', items: [] }];
  for (let i = 0; i < M; i++) {
    const s = addMnd(p0, i);
    B.push({ label: s.toLocaleDateString('nl-NL', { month: 'short' }) + ` '${String(s.getFullYear()).slice(2)}`, lang: s.toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' }), items: [] });
  }
  for (const c of act) {
    if (!c.eindD) continue;
    if (c.eindD < state.peil) { B[0].items.push(c); continue; }
    const i = (c.eindD.getFullYear() - p0.getFullYear()) * 12 + c.eindD.getMonth() - p0.getMonth();
    if (i >= 0 && i < M) B[i + 1].items.push(c);
  }
  const W = 760, H = 250, L = 30, R = 8, T = 26, Bm = 30;
  const pw = W - L - R, ph = H - T - Bm, step = pw / B.length, bw = Math.max(4, step - 6);
  const maxV = Math.max(1, ...B.map(b => b.items.length));
  const tickStep = maxV <= 5 ? 1 : maxV <= 12 ? 2 : maxV <= 30 ? 5 : 10;
  const top = Math.ceil(maxV / tickStep) * tickStep;
  const y = v => T + ph - v / top * ph;
  const kleur = { rood: 'var(--crit)', geel: 'var(--warn)', groen: 'var(--good)' };
  let g = '';
  for (let v = 0; v <= top; v += tickStep) g += `<line class="${v === 0 ? 'baseline' : 'gridline'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  B.forEach((b, i) => {
    const x = L + i * step + (step - bw) / 2;
    const segs = ['rood', 'geel', 'groen'].map(kl => [kl, b.items.filter(c => klasse(c) === kl).length]).filter(([, n]) => n);
    let base = T + ph;
    segs.forEach(([kl, n], j) => {
      const h = n / top * ph, y0 = base - h, gap = j > 0 ? 2 : 0, bot = base - gap;
      if (j === segs.length - 1) {
        const r = Math.max(0, Math.min(4, bot - y0, bw / 2));
        g += `<path d="M${x},${bot} V${y0 + r} Q${x},${y0} ${x + r},${y0} H${x + bw - r} Q${x + bw},${y0} ${x + bw},${y0 + r} V${bot} Z" fill="${kleur[kl]}"/>`;
      } else g += `<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(0, bot - y0)}" fill="${kleur[kl]}"/>`;
      base = y0;
    });
    if (i === 0) g += `<text x="${L}" y="${H - 10}">Verlopen</text>`;
    else if (i >= 3 && i % 3 === 0) g += `<text x="${L + i * step + step / 2}" y="${H - 10}" text-anchor="middle">${b.label}</text>`;
    const n = b.items.length, cnt = kl => b.items.filter(c => klasse(c) === kl).length;
    const namen = b.items.slice(0, 6).map(c => '• ' + c.naam).join('\n') + (n > 6 ? `\n… en ${n - 6} meer` : '');
    const tip = `${b.lang}\n${n} ${mv(n)} · ${eur(sum(b.items, c => c.bedrag))}${n ? `\nRood ${cnt('rood')} · geel ${cnt('geel')} · groen ${cnt('groen')}\n${namen}` : ''}`;
    g += `<rect class="hit" x="${L + i * step}" y="${T}" width="${step}" height="${ph}" data-tip="${esc(tip)}"/>`;
  });
  const xm = L + (N.signaalMnd + 1) * step;
  if (N.signaalMnd < M) g += `<line class="marker" x1="${xm}" x2="${xm}" y1="${T - 14}" y2="${T + ph}"/><text class="marker-label" x="${xm - 6}" y="${T - 4}" text-anchor="end">← binnen ${N.signaalMnd} mnd</text>`;
  return `<div class="legend">
      <span><i style="background:var(--crit)"></i>Te laat of verlopen</span>
      <span><i style="background:var(--warn)"></i>Binnen 3 mnd actie</span>
      <span><i style="background:var(--good)"></i>Plan vastgelegd of nog tijd</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gestapeld staafdiagram: aflopende contracten per maand naar urgentie">${g}</svg>`;
}

function koppelkansen(lijst) {
  const out = [], horizon = addMnd(state.peil, 36);
  for (const [thema, l0] of groupBy(lijst, c => c.thema)) {
    let beste = null;
    const l = l0.filter(c => c.eindD && c.eindD >= state.peil && c.eindD <= horizon).sort((a, b) => a.eindD - b.eindD);
    let i = 0;
    while (i < l.length) {
      let j = i;
      while (j + 1 < l.length && mndTussen(l[i].eindD, l[j + 1].eindD) <= 6) j++;
      if (j - i >= 2 && (!beste || j + 1 - i > beste.g.length)) beste = { thema, g: l.slice(i, j + 1) };
      i = j > i ? j + 1 : i + 1;
    }
    if (beste) out.push(beste);
  }
  return out.sort((a, b) => b.g.length - a.g.length);
}

        <ul>${kk.g.map(c => `<li data-open="${esc(c.nr)}">${esc(c.naam)} <span class="muted">(${fmtDkort(c.eindD)})</span></li>`).join('')}</ul></div>`).join('') || '<p class="muted">Geen koppelkansen in deze selectie.</p>'}</div>

function renderWerk(el) {

  const eigen = groupBy(basis.flatMap(c => c._open).filter(a => a.lvl !== 'info'), a => a.wie.naam);

  const personen = groepen.filter(([p]) => p).map(([p, l]) => {
    const acts = eigen.get(p) || [];
    return { p, n: l.length, w: sum(l, c => c.bedrag), acts: acts.length, laat: acts.filter(a => bucket(a) === 'telaat').length };
  }).sort((a, b) => b.n - a.n);
  const leeg = (groepen.find(([p]) => !p) || [null, []])[1];

    <div><label><input type="checkbox" data-vertrek="${esc(x.p)}" ${state.vertrek.has(x.p) ? 'checked' : ''}> vertrekt</label></div>`;
  el.innerHTML = `
    <p class="scope">Wie heeft hoeveel contracten en acties? Klik een naam om het dashboard als die persoon te bekijken. Vink <b>vertrekt</b> aan om de contracten van die persoon te laten signaleren.</p>
    <section class="card">
      <div class="toolbar">
        <div class="seg" role="group">${Object.entries(ROL).map(([key, v]) => `<button type="button" data-werkrol="${key}" aria-pressed="${key === rol}">${v}</button>`).join('')}</div>
        <span class="count">${personen.length} personen · ${basis.length} actieve contracten</span>
      </div>
      ${kc ? `<div class="cap">
        <div><span class="k">Nodig bij norm ${kc.norm}</span><b>${kc.nodig}</b> ${ROLMV[rol]}</div>
        <div><span class="k">Beschikbaar</span><b>${kc.blijft}</b>${kc.vertrekt ? ` <span class="muted">+${kc.vertrekt} vertrekt</span>` : ''}</div>
        <div><span class="k">${kc.tekort > 0 ? 'Tekort' : 'Ruimte'}</span><b class="${kc.tekort > 0 ? 'laat' : ''}">${Math.abs(kc.tekort)}</b> ${kc.tekort > 0 ? 'personen' : ''}</div>

      <p class="note" style="margin:0 0 4px">${capTekst(kc)} Indicatie: één persoon telt als volledige inzet op contractmanagement. Norm aanpassen via <button class="link" id="naar-normen" type="button">Normen</button>.</p>`
      : `<p class="note" style="margin:0">Contracteigenaren nemen de besluiten. ${mtActs ? `<b>${mtActs}</b> ${mvA(mtActs)} liggen bij het MT, omdat er geen eigenaar is.` : ''}</p>`}
      <div class="werk">
        <div class="h">${ROL[rol]}</div><div class="h">Actieve contracten</div><div class="h">Contracten · waarde · open acties</div><div class="h">Signaal</div>
        ${personen.map(rij).join('')}

/* ======================= Contractdetail ======================= */
function tramSvg(c) {
  if (!c.startD || !c.eindD) return '<p class="muted">Start- of einddatum ontbreekt.</p>';
  const W = 560, H = 132, x0 = 20, x1 = W - 20, y = 68;
  const tot = c.eindD - c.startD || 1;
  const pos = d => x0 + Math.max(0, Math.min(1, (d - c.startD) / tot)) * (x1 - x0);
  const frac = (state.peil - c.startD) / tot, xp = pos(state.peil);
  const aanb = addMnd(c.eindD, -doorloop(c)), xa = pos(aanb);
  let s = '';
  for (let x = x0; x <= x1; x += 10) s += `<line x1="${x}" x2="${x}" y1="${y - 5}" y2="${y + 5}" stroke="var(--grid)" stroke-width="2"/>`;
  s += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--axis)" stroke-width="4" stroke-linecap="round"/>`;
  s += `<line x1="${x0}" x2="${xp}" y1="${y}" y2="${y}" stroke="var(--series)" stroke-width="4" stroke-linecap="round"/>`;
  const halte = (x, kleur) => `<circle cx="${x}" cy="${y}" r="6" fill="var(--surface)" stroke="${kleur}" stroke-width="3"/>`;
  s += halte(x0, 'var(--ink-2)') + halte(x1, 'var(--ink-2)');
  if (aanb > c.startD) s += halte(xa, aanb < state.peil ? 'var(--crit)' : 'var(--warn)') + `<text class="lbl" x="${Math.max(x0 + 115, Math.min(x1 - 115, xa))}" y="${y + 44}" text-anchor="middle">Uiterste start aanbesteding · ${fmtD(aanb)}</text>`;
  s += `<text class="lbl" x="${x0}" y="${y + 24}">Start · ${fmtD(c.startD)}</text><text class="lbl" x="${x1}" y="${y + 24}" text-anchor="end">Einde · ${fmtD(c.eindD)}</text>`;
  const tx = Math.max(x0 + 2, Math.min(x1 - 46, xp - 23));
  s += `<g transform="translate(${tx},${y - 30})" aria-hidden="true">
    <path d="M14,0 L22,-8 L30,0" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>
    <rect x="0" y="0" width="46" height="20" rx="6" fill="var(--brand)"/>
    <rect x="4" y="4" width="8" height="7" rx="1.5" fill="#fff" opacity=".9"/><rect x="15" y="4" width="8" height="7" rx="1.5" fill="#fff" opacity=".9"/>
    <rect x="26" y="4" width="8" height="7" rx="1.5" fill="#fff" opacity=".9"/><rect x="37" y="4" width="6" height="7" rx="1.5" fill="#fff" opacity=".9"/>
    <circle cx="10" cy="22" r="3" fill="var(--ink)"/><circle cx="36" cy="22" r="3" fill="var(--ink)"/></g>`;
  const lbl = frac > 1 ? 'Voorbij eindhalte: verlopen' : frac < 0 ? 'Nog niet vertrokken' : `Vandaag · ${Math.round(frac * 100)}% van de looptijd`;
  s += `<text class="lbl-b" x="${Math.max(x0 + 60, Math.min(x1 - 60, xp))}" y="${y - 48}" text-anchor="middle">${lbl}</text>`;
  return `<svg class="tram" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Voortgang looptijd: ${esc(lbl)}">${s}</svg>`;
}

        <div><span class="k">Contracttype</span>${esc(c.type || '—')}</div>
        <div><span class="k">Exacte waarde</span>${eurVol(c.bedrag)}</div>
        <div><span class="k">Status</span>${esc(c.status)} · versie ${c.versie ?? '—'} (${esc(c.vstatus || '')})</div>
      </div>
      <h3>Versiegeschiedenis</h3>
      <div class="tbl-scroll"><table class="tbl"><thead><tr><th>Versie</th>${velden.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead>
        <tbody>${vs.map((v, i) => `<tr style="cursor:default"><td>${v.versie ?? '—'}</td>${velden.map(([key]) => `<td class="${i > 0 && String(vs[i - 1][key]) !== String(v[key]) ? 'chg' : ''}">${fmtVeld(key, v[key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="bron">Bron: ${esc(META.bron)}, Excel-regel ${vs.map(v => v.regel).join(', ')}.</p>
    </details>`;
  $('#drawer').classList.add('open');
  $('#scrim').hidden = false;
  $('#drawer-sluit').addEventListener('click', sluitContract);
  if (focus) $('#drawer-sluit').focus({ preventScroll: true });
}
/* Demo: deterministische voorbeeld-aanvullingen (alleen bij dummydata) */
function hash01(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
function bewaarAanvullingen() {
  store.set('plan', state.plan); store.set('status', state.status); store.set('kwaliteit', state.kwaliteit);
  store.set('toewijzing', state.toewijzing); store.set('vertrek', [...state.vertrek]);
}
function vulVoorbeeld() {
  const plan = {}, kwaliteit = {};
  for (const c of C) {
    if (c.status !== 'Actief') continue;
    const r = hash01(c.nr), r2 = hash01(c.nr + 'k'), r3 = hash01(c.nr + 'g');
    if (isAflopend(c)) {
      if (r < 0.25) plan[c.nr] = 'aanbesteding';
      else if (r < 0.45) plan[c.nr] = 'verlengen';
      else if (r < 0.55) plan[c.nr] = 'beeindigen';
      else if (r < 0.68) plan[c.nr] = 'optie';
      else if (r < 0.75) plan[c.nr] = 'geenoptie';
    }
    if (r2 < 0.45) kwaliteit[c.nr] = { oordeel: r2 < 0.04 ? 'onvoldoende' : r2 < 0.11 ? 'aandacht' : 'goed', gesprek: isoDate(addMnd(state.peil, -(1 + Math.floor(r3 * 4)))) };
  }
  state.plan = plan; state.kwaliteit = kwaliteit; state.status = {};
  herbereken();
  for (const c of C) for (const a of c._a) { const r = hash01(a.id); if (a.lvl !== 'info' && r < 0.25) state.status[a.id] = r < 0.08 ? 'klaar' : 'bezig'; }
  bewaarAanvullingen(); render();
}
function wisAanvullingen() {
  state.plan = {}; state.status = {}; state.kwaliteit = {}; state.toewijzing = {}; state.vertrek = new Set();
  bewaarAanvullingen(); render();
}
function sluitContract() { state.open = null; $('#drawer').classList.remove('open'); $('#scrim').hidden = true; }
function zetStatus(id, v) { if (v === 'open') delete state.status[id]; else state.status[id] = v; store.set('status', state.status); }

/* ======================= Maandbericht & normen ======================= */
function maandbericht() {
  const N = state.norm, act = actief(sel());
  const maand = state.peil.toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' });
  const lijst = actiesInBeeld().sort(vergelijk(!persoonView()));
  const groepen = groupBy(lijst, bucket);
  const f = key => act.filter(FILTERS[key][1]);
  const regels = [`Maandoverzicht contracten ${maand}: ${scopeNaam()}`, `Peildatum ${fmtD(state.peil)} · bron: ${META.bron}`, ''];
  if (!persoonView()) {
    const kc = capaciteit('cm', act);
    regels.push('KERNCIJFERS',
      `- ${act.length} actieve contracten, totale waarde ${eur(sum(act, c => c.bedrag))}.`,
      `- ${f('aflopend').length} lopen af binnen ${N.signaalMnd} maanden; ${f('zonderplan').length} daarvan zonder plan (${eur(sum(f('zonderplan'), c => c.bedrag))}).`,
      `- ${f('telaat').length + f('verlopen').length} contracten zijn te laat met aanbesteden, besluiten of status bijwerken.`,
      `- ${f('rol').length} contracten missen een rol.`,
      kc ? `- Capaciteit: ${capTekst(kc).replace(/<[^>]+>/g, '')}` : '', '');
  }
  regels.push(persoonView() ? 'JOUW ACTIES' : 'ACTIES (urgentste eerst)');
  if (!lijst.length) regels.push('Geen open acties.');
  let teller = 0;
  for (const b of Object.keys(BUCKETS)) if (groepen.has(b) && teller < 15) {
    regels.push(`${BUCKETS[b]}:`);
    for (const a of groepen.get(b)) { if (teller++ >= 15) break; regels.push(`- ${a.wat}: ${a.c.naam} (${a.c.nr}), uiterlijk ${fmtD(a.uiterlijk)}${persoonView() ? '' : `, ${a.wie.rol === 'mt' ? 'MT' : a.wie.naam}`}`); }
  }
  if (lijst.length > 15) regels.push(`… en ${lijst.length - 15} meer in het dashboard.`);
  regels.push('', 'Open het dashboard voor details, bronnen en om acties af te vinken.', 'Automatisch samengesteld uit de contractexport. Controleer bij twijfel de bron.');
  return { onderwerp: `Contracten ${maand}: ${lijst.length} ${mvA(lijst.length)} voor ${scopeNaam()}`, tekst: regels.join('\n') };
}
function openBericht() {
  const { onderwerp, tekst } = maandbericht();
  $('#bericht-sub').textContent = `Voor ${scopeNaam()}. Kies bij “Bekijk als” een persoon voor een persoonlijk bericht met alleen diens acties.`;
  $('#bericht-tekst').value = tekst;
  $('#bericht-mail').href = `mailto:?subject=${encodeURIComponent(onderwerp)}&body=${encodeURIComponent(tekst)}`;
  $('#dlg-bericht').showModal();
}
function openNormen() {
  $('#normen-rows').innerHTML = Object.entries(NORM_LABEL).map(([key, [l, u]]) =>
    `<label class="row"><span>${l}<small>${u}</small></span><input type="number" min="0" step="${key === 'drempel' ? 1000 : 1}" name="${key}" value="${state.norm[key]}"></label>`).join('');
  $('#dlg-normen').showModal();
}

/* ======================= Filters, render, events ======================= */
function syncFilters() {
  $('#f-rol').value = state.rol;
  const ps = $('#f-persoon');
  $('#f-persoon-wrap').hidden = state.rol === 'mt';
  if (state.rol !== 'mt') {
    const namen = [...new Set(C.map(c => c[state.rol]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'nl'));
    ps.innerHTML = `<option value="">Kies je naam…</option>` + namen.map(n => `<option ${n === state.persoon ? 'selected' : ''}>${esc(n)}</option>`).join('');
  }
  $('#rolhint').textContent = ROLTAAK[state.rol];
  $('#f-peil').value = isoDate(state.peil);
  $('#f-inactief').checked = state.inactief;
}
function renderChips() {
  $('#f-themas').innerHTML = `<button class="chip" type="button" data-chip="" aria-pressed="${state.themas.size === 0}">Alle thema's</button>` +
    THEMAS.map(t => `<button class="chip" type="button" data-chip="${esc(t)}" aria-pressed="${state.themas.has(t)}">${esc(t)}</button>`).join('');
}
function render() {
  herbereken();
  $('#badge').textContent = META.dummy ? 'Prototype · fictieve data' : 'Prototype';
  const nAanv = Object.keys(state.plan).length + Object.keys(state.status).length + Object.keys(state.kwaliteit).length + Object.keys(state.toewijzing).length + state.vertrek.size;
  $('#meta').textContent = `Bron: ${META.bron} · gebouwd ${fmtD(parseDate(META.gebouwd))}${nAanv ? ` · ${nAanv} aanvullingen in deze browser` : ''}`;
  const nA = actiesInBeeld().length;
  $('#n-acties').textContent = nA; $('#n-acties').hidden = !nA;
  $('#n-contracten').textContent = sel().length;
  const nf = state.themas.size + (state.inactief ? 1 : 0) + (isoDate(state.peil) !== META.peildatum ? 1 : 0);
  $('#btn-filters').textContent = nf ? `Meer filters (${nf})` : 'Meer filters';
  renderChips();
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
  ({ overzicht: renderOverzicht, acties: renderActies, contracten: renderContracten, thema: renderThema, werk: renderWerk, hoe: renderHoe }[state.tab] || renderOverzicht)($('#main'));
}
function gaNaar(tab) { state.tab = tab; store.set('tab', tab); render(); window.scrollTo({ top: 0 }); }

$('#f-rol').addEventListener('change', e => { state.rol = e.target.value; state.persoon = ''; state.acties.wie = null; syncFilters(); render(); });
$('#f-persoon').addEventListener('change', e => { state.persoon = e.target.value; state.acties.wie = null; render(); });
$('#f-peil').addEventListener('change', e => { const d = parseDate(e.target.value); if (d) { state.peil = d; render(); } });
$('#f-inactief').addEventListener('change', e => { state.inactief = e.target.checked; render(); });
$('#f-themas').addEventListener('click', e => {
  const b = e.target.closest('[data-chip]'); if (!b) return;
  const t = b.dataset.chip;
  if (!t) state.themas.clear(); else if (state.themas.has(t)) state.themas.delete(t); else state.themas.add(t);
  render();
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) gaNaar(b.dataset.tab); });
$('#btn-print').addEventListener('click', () => window.print());
$('#btn-filters').addEventListener('click', e => {
  const p = $('#filters-meer'); p.hidden = !p.hidden; e.currentTarget.setAttribute('aria-expanded', String(!p.hidden));
});
$('#btn-bericht').addEventListener('click', openBericht);
$('#btn-normen').addEventListener('click', openNormen);
$('#bericht-sluit').addEventListener('click', () => $('#dlg-bericht').close());
$('#bericht-kopie').addEventListener('click', e => kopieer($('#bericht-tekst').value, e.target, 'Kopieer tekst'));
$('#dlg-normen').addEventListener('close', () => {
  const v = $('#dlg-normen').returnValue;
  if (v === 'reset') state.norm = { ...NORM0 };
  else if (v === 'ok') for (const inp of $$('#normen-rows input')) { const n = Number(inp.value); if (Number.isFinite(n) && n >= 0) state.norm[inp.name] = n; }
  else return;
  store.set('norm', state.norm); render();
});
$('#scrim').addEventListener('click', sluitContract);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.open) sluitContract(); });
addEventListener('beforeprint', () => $$('details').forEach(d => { d.dataset.wasOpen = d.open ? '1' : ''; d.open = true; }));
addEventListener('afterprint', () => $$('details').forEach(d => { d.open = d.dataset.wasOpen === '1'; }));

// Doorklikken in de hoofdinhoud
$('#main').addEventListener('click', e => {
  if (e.target.closest('select, input, textarea, label, summary')) return;
  const t = e.target.closest('[data-open],[data-nr],[data-goto],[data-thema],[data-tab-go],[data-focus],[data-wis],[data-intro],[data-demo]');
  if (!t) return;
  if (t.dataset.demo) { if (t.dataset.demo === 'vul') vulVoorbeeld(); else wisAanvullingen(); }
  else if (t.dataset.focus) { state.focus = state.focus === t.dataset.focus ? null : t.dataset.focus; render(); }
  else if (t.dataset.intro) { state.intro = false; store.set('intro', false); render(); }
  else if (t.dataset.wis) { state.themas.clear(); state.rol = 'mt'; state.persoon = ''; state.inactief = false; state.lijst.filter = 'alle'; state.acties.wie = null; syncFilters(); render(); }
  else if (t.dataset.goto) { state.lijst.filter = t.dataset.goto; state.lijst.zoek = ''; gaNaar('contracten'); }
  else if (t.dataset.thema) { state.themas = new Set([t.dataset.thema]); state.lijst.filter = 'alle'; gaNaar('contracten'); }
  else if (t.dataset.tabGo) { if (t.dataset.wieAlle) state.acties.wie = ''; gaNaar(t.dataset.tabGo); }
  else openContract(t.dataset.open || t.dataset.nr);
});
$('#main').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.status) { zetStatus(t.dataset.status, t.value); render(); }
});
// Wijzigingen in het contractdetail: status, toewijzing, plan, kwaliteit
$('#drawer').addEventListener('change', e => {
  const t = e.target, nr = state.open;
  if (!nr) return;
  if (t.dataset.status) zetStatus(t.dataset.status, t.value);
  else if (t.dataset.wie) {
    if (t.value === '__auto') delete state.toewijzing[t.dataset.wie]; else state.toewijzing[t.dataset.wie] = t.value;
    store.set('toewijzing', state.toewijzing);
  } else if (t.id === 'plan') {
    if (t.value === 'onbekend') delete state.plan[nr]; else state.plan[nr] = t.value;
    store.set('plan', state.plan);
  } else if (t.id === 'k-oordeel' || t.id === 'k-gesprek') {
    const kw = { ...(state.kwaliteit[nr] || {}) };
    kw[t.id === 'k-oordeel' ? 'oordeel' : 'gesprek'] = t.value;
    if (!kw.oordeel && !kw.gesprek) delete state.kwaliteit[nr]; else state.kwaliteit[nr] = kw;
    store.set('kwaliteit', state.kwaliteit);
  } else return;
  const sc = $('#drawer').scrollTop;
  render(); openContract(nr, { focus: false });
  $('#drawer').scrollTop = sc;
});
// Tooltip
const tip = $('#tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
});
document.addEventListener('mousemove', e => {
  if (tip.hidden) return;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

// Deeplinks: #acties, #contracten, #thema, #werk, #hoe, #tijd, #geld, #kwaliteit, #rollen,
// #contract=NR, #persoon=rol:Naam, #demo (voorbeeld-aanvullingen), #bericht (maandbericht)
function leesHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const i = h.indexOf('='), key = i < 0 ? h : h.slice(0, i), v = i < 0 ? '' : h.slice(i + 1);
  if (['overzicht', 'acties', 'contracten', 'thema', 'werk', 'hoe'].includes(key)) state.tab = key;
  if (key in PANELS) { state.tab = 'overzicht'; state.focus = key; }
  if (key === 'persoon' && v.includes(':')) { const [r, ...naam] = v.split(':'); if (ROL[r]) { state.rol = r; state.persoon = naam.join(':'); } }
  return key === 'contract' ? v : key === 'demo' || key === 'bericht' ? '#' + key : null;
}
if (META.terug) { const a = $('#terug'); a.href = META.terug; a.hidden = false; }
const start = leesHash();
syncFilters();
render();
if (start === '#demo' && META.dummy) vulVoorbeeld();
else if (start === '#bericht') openBericht();
else if (start) openContract(start);
</script>
</body>
