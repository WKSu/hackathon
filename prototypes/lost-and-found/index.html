<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost & Found – vindt en verbindt</title>
<style>
:root{
  --green:#00811F; --green-d:#1D7F34; --red:#E3614D; --mist:#EFF4F6;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#EFF4F6; --ink:#000000; --ink-2:#4A5852; --line:#D3DDE1;
  --head:#00811F; --head-ink:#FFFFFF; --link:#00701B;
  --water:#8DBFDC; --sea:#B9D7E8; --water-ink:#FFFFFF;
  --nb:#CFE8D6; --ni:#9FD0AC; --zb:#CBD8DF; --zi:#A3B9C4;
  --sel:#00811F; --sel-ink:#FFFFFF; --badge:#1D7F34;
  --avl:86%; --hero:#00811F; --pill:#E3EEE6; --shadow:0 1px 2px rgba(0,40,10,.08),0 8px 24px rgba(0,40,10,.06);
  --font-head:"Bolder Heading","Bolder","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-body:"Bolder Light","Bolder","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101716; --surface:#16201E; --surface-2:#1C2927; --ink:#EEF3F0; --ink-2:#A7B7B0; --line:#2B3B38;
    --head:#0B5E1A; --link:#5ED07A; --water:#2C5C78; --sea:#22495F;
    --nb:#2A5536; --ni:#3B7A4C; --zb:#33454D; --zi:#4A616C; --sel:#2FAE4E; --badge:#2FAE4E;
    --avl:32%; --hero:#5ED07A; --pill:#21342C; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101716; --surface:#16201E; --surface-2:#1C2927; --ink:#EEF3F0; --ink-2:#A7B7B0; --line:#2B3B38;
  --head:#0B5E1A; --link:#5ED07A; --water:#2C5C78; --sea:#22495F;
  --nb:#2A5536; --ni:#3B7A4C; --zb:#33454D; --zi:#4A616C; --sel:#2FAE4E; --badge:#2FAE4E;
  --avl:32%; --hero:#5ED07A; --pill:#21342C; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-head);line-height:1.15;margin:0}

/* kopbalk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:12px 24px}
.brand{display:flex;flex-direction:column;line-height:1.1;text-decoration:none;color:inherit}
.brand b{font-family:var(--font-head);font-size:22px;letter-spacing:-.01em}
.brand span{font-size:13px;opacity:.9}
.search{position:relative;max-width:640px;width:100%;justify-self:center}
.search input{width:100%;height:42px;border:0;border-radius:10px;padding:0 14px 0 40px;font:inherit;font-size:15px;background:#fff;color:#000}
.search svg{position:absolute;left:12px;top:11px;width:20px;height:20px;color:#4A5852;pointer-events:none}
.results{position:absolute;left:0;right:0;top:48px;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:6px;max-height:min(70vh,520px);overflow:auto;z-index:40}
.results button{display:grid;grid-template-columns:76px 1fr;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;align-items:baseline}
.results button[aria-selected="true"],.results button:hover{background:var(--surface-2)}
.results .ty{font-size:12px;color:var(--ink-2)}
.results .lb{font-weight:600}
.results small{display:block;color:var(--ink-2);font-size:13px}
.results .empty{padding:12px;color:var(--ink-2);font-size:14px}
.tools{display:flex;gap:10px;align-items:center}
.tbtn{height:40px;border-radius:10px;border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff;color:var(--green-d);border-color:#fff}
.bell{position:relative;width:42px;justify-content:center;padding:0}
.bell .n{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.bell .n:empty{display:none}

/* tabs */
.tabs{display:flex;gap:4px;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto}
.tabs a{padding:12px 14px;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.tabs a.on{color:var(--ink);border-bottom-color:var(--green)}
.tabs .proto{margin-left:auto;font-size:13px;color:var(--ink-2);white-space:nowrap;padding-left:16px}
.tabs .proto b{color:var(--red);font-weight:600}

/* indeling */
.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);gap:28px;max-width:1440px;margin:0 auto;padding:22px 24px 48px}
.layout.full{grid-template-columns:minmax(0,1fr)}
.layout.full .mapcol{display:none}
.mapcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px);align-self:start}
.maphead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.maphead h2{font-size:18px}
.maphead p{margin:0;color:var(--ink-2);font-size:14px}
.mapbox{background:var(--surface-2);border-radius:16px;padding:10px;overflow-x:auto}
.mapbox svg{display:block;width:100%;min-width:620px;height:auto}
.tile{cursor:pointer}
.tile rect.b{fill:var(--c);stroke:var(--surface-2);stroke-width:3;transition:fill .15s}
.tile text{fill:var(--ink);font-family:var(--font-head);font-size:13px;pointer-events:none}
.tile:hover rect.b,.tile:focus rect.b{stroke:var(--green);stroke-width:3}
.tile:focus{outline:none}
.tile.sel rect.b{fill:var(--sel)}
.tile.sel text{fill:var(--sel-ink)}
.tile.hl rect.b{stroke:var(--green);stroke-width:3}
.map.dimming .tile:not(.hl):not(.sel){opacity:.38}
.tile .pc{fill:var(--badge)}
.tile .pct{fill:#fff;font-size:11px;font-family:var(--font-body);font-weight:700}
.tile .sd{fill:var(--red);stroke:var(--surface-2);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 4px 0;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.legend .num{width:16px;height:16px;border-radius:50%;background:var(--badge);color:#fff;font-size:10px;display:inline-grid;place-items:center;font-weight:700}
.arealist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.arealist a{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);text-decoration:none;color:var(--ink)}
.arealist a.on{background:var(--sel);color:var(--sel-ink)}

/* paneel */
.panel{min-width:0}
.crumb{font-size:14px;color:var(--ink-2);margin:0 0 6px}
.crumb a{color:var(--ink-2)}
.ph{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.ph h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2);margin:6px 0 4px}
.meta b{color:var(--ink);font-weight:600}
.sec{margin-top:26px}
.sec>h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec>h3 .cnt{font-family:var(--font-body);font-size:13px;color:var(--ink-2);font-weight:400}
.follow{flex:none;height:38px;padding:0 14px;border-radius:10px;border:1.5px solid var(--green);background:transparent;color:var(--link);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.follow[aria-pressed="true"]{background:var(--green);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface-2);text-decoration:none;color:var(--ink);max-width:100%}
a.chip:hover{background:var(--pill)}
.chip .cn{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.chip b{font-weight:600;font-size:14px}
.chip small{font-size:12px;color:var(--ink-2)}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:hsl(var(--h,140) 32% var(--avl));color:var(--ink)}
.av.ph{background-size:cover;background-position:center;color:transparent}
.own{display:inline-block;font-size:12px;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);margin-right:6px;color:var(--ink)}
.dsub{font-size:13px;font-weight:700;color:var(--ink-2);margin:14px 0 0}
.addf{display:flex;gap:6px;flex-wrap:wrap;margin:10px 20px 0}
.addf select{flex:1 1 140px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:0 8px}
.addf .btn{height:38px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 20px 0;font-size:13px;color:var(--ink-2)}
.fchips button{border:0;background:var(--green);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px}
@media (max-width:960px){.twocol{grid-template-columns:minmax(0,1fr)}}
.chip.vac{background:transparent;border:1.5px dashed var(--line)}
.chip.vac .av{background:transparent;border:1.5px dashed var(--ink-2);color:var(--ink-2)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center}
.row>span{font-size:14px;color:var(--ink-2)}
.cards{display:grid;gap:10px}
.pcard{display:block;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--green)}
.pcard .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .t b{font-weight:600;font-size:15px}
.pcard .s{font-size:13px;color:var(--ink-2);margin-top:4px}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--pill);color:var(--ink);white-space:nowrap}
.pill.f0,.pill.f1{background:var(--surface-2);border:1px solid var(--line)}
.pill.f4{background:var(--green);color:#fff}
.pill.f5{background:var(--green-d);color:#fff}
.empty{padding:14px 16px;border-radius:12px;border:1.5px dashed var(--line);color:var(--ink-2);font-size:14px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:13px;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tlink{font-weight:600}

/* fase */
.fase{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:14px 0 4px}
.fase div{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.fase div.done{background:var(--ni);border-color:transparent}
.fase div.now{background:var(--green);border-color:transparent}
.faselab{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:11px;color:var(--ink-2)}
.faselab span.now{color:var(--ink);font-weight:700}

/* signalen */
.sig{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.sig:first-child{border-top:0}
.sig .ic{font-size:18px;line-height:1.3}
.sig .h{font-weight:600;font-size:15px;line-height:1.3}
.sig.unread .h::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:2px}
.sig .m{font-size:13px;color:var(--ink-2);margin-top:2px}
.sig .sx{font-size:14px;margin-top:4px}
.sig .tip{font-size:14px;margin-top:8px;padding:8px 12px;border-left:3px solid var(--green);background:var(--surface-2);border-radius:0 8px 8px 0}
.sig .lk{font-size:13px;margin-top:6px;display:inline-block}

/* intro */
.hero h1{font-size:clamp(44px,5.6vw,76px);letter-spacing:-.025em;color:var(--hero);line-height:.95}
.hero p{font-size:18px;max-width:34em;margin:14px 0 18px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1.5px solid var(--green);background:transparent;color:var(--link);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.pri{background:var(--green);color:#fff}
details.keep{margin-top:26px;border-radius:14px;background:var(--surface-2);padding:14px 18px}
details.keep summary{cursor:pointer;font-family:var(--font-head);font-size:17px}
details.keep ul{margin:10px 0 4px;padding-left:20px}
details.keep li{margin:6px 0;font-size:15px}

/* thema-overzicht en organisatie */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--green)}
.tcard b{font-family:var(--font-head);font-size:18px}
.tcard small{color:var(--ink-2);font-size:13px}
.tcard .nums{font-size:13px;color:var(--ink-2);margin-top:auto}
.pagehead h2{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.01em}
.pagehead p{color:var(--ink-2);margin:6px 0 0;max-width:46em}
.acts-list{margin:0;padding-left:20px}
.acts-list li{margin:5px 0;font-size:15px}
.acts-list small{color:var(--ink-2)}
.morebtn{margin-top:8px;background:none;border:0;color:var(--link);font-weight:600;cursor:pointer;padding:0}

/* lade meldingen */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:50;box-shadow:-12px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer[hidden]{display:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.dhead h2{font-size:22px}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--ink-2);padding:4px 8px}
.seg{display:flex;gap:4px;margin:0 20px;background:var(--surface-2);border-radius:10px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dbody{overflow:auto;padding:6px 20px 12px;flex:1}
.dfoot{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.volgt{font-size:13px;color:var(--ink-2);margin:10px 20px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
.scrim[hidden]{display:none}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.4)}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:20px}
.mail{padding:4px 20px 20px}
.mail .hdr{font-size:14px;color:var(--ink-2);display:grid;grid-template-columns:80px 1fr;gap:2px 8px;padding:12px 0;border-bottom:1px solid var(--line)}
.mail .hdr b{color:var(--ink);font-weight:600}
.mail h3{font-size:16px;margin:18px 0 8px}
.mail ul{padding-left:20px;margin:0}
.mail li{margin:6px 0}
.ideas-all{padding:6px 20px 20px}
.ideas-all h3{font-size:16px;margin:16px 0 4px}
.ideas-all p{margin:0;font-size:15px}

/* ideeën-modus */
.idea{display:none;width:28px;height:28px;border-radius:50%;border:0;background:#FFE7A3;color:#000;cursor:pointer;font-size:15px;line-height:1;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 3px rgba(255,199,0,.35);vertical-align:middle}
body.ideas .idea{display:inline-flex;animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,199,0,.7)}100%{box-shadow:0 0 0 12px rgba(255,199,0,0)}}
@media (prefers-reduced-motion:reduce){body.ideas .idea{animation:none}}
.pop{position:fixed;z-index:70;max-width:340px;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:14px 16px;font-size:14px;border-top:4px solid #F2C230}
.pop[hidden]{display:none}
.pop b{display:block;font-family:var(--font-head);font-size:16px;margin-bottom:4px}
.pop p{margin:0 0 8px}
.pop .nu{color:var(--ink-2);font-size:13px}
.pop button{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;z-index:80;max-width:min(92vw,520px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast[hidden]{display:none}

@media (max-width:960px){
  .top{grid-template-columns:1fr auto;gap:10px 12px;padding:10px 14px}
  .search{grid-column:1/-1;grid-row:2;max-width:none}
  .brand b{font-size:19px}
  .tabs{padding:0 10px}
  .tabs .proto{display:none}
  .layout{grid-template-columns:minmax(0,1fr);padding:16px 14px 40px;gap:22px}
  .mapcol{position:static}
  .row{grid-template-columns:1fr;gap:4px}
  .tbtn .lbl{display:none}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#kaart"><b>Lost &amp; Found</b><span>Vind je collega bij Mobiliteit</span></a>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" placeholder="Zoek op gebied, wijk, straat, thema, project of collega" aria-label="Zoeken" aria-controls="results">
    <div id="results" class="results" role="listbox" hidden></div>
  </div>
  <div class="tools">
    <button class="tbtn" id="ideasBtn" aria-pressed="false" title="Laat zien wat er later nog kan">✨ <span class="lbl">Wat kan nog meer</span></button>
    <button class="tbtn bell" id="bellBtn" aria-label="Meldingen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="n" id="bellN"></span></button>
  </div>
</header>
<nav class="tabs" aria-label="Weergaven">
  <a href="#kaart" data-tab="kaart">Gebieden</a>
  <a href="#themas" data-tab="themas">Thema’s</a>
  <a href="#organisatie" data-tab="organisatie">Organisatie</a>
  <span class="proto"><b>Openbare versie</b> met fictieve namen, themadag 5 november 2026</span>
</nav>

const PEO = D.people;
const hue = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 997; return 110 + (h % 90); };
const initials = n => n.replace(/\(.*?\)/g,'').split(/\s+/).filter(w => w && w[0] === w[0].toUpperCase() && /[A-ZÀ-Ý]/.test(w[0])).map(w => w[0]).slice(0,2).join('') || n[0];
const ICON = {document:'📄', raakvlak:'🔗', werk:'🚧', team:'👥', status:'🔄', vertrouwelijk:'🔒', werkplan:'📋', overleg:'📅'};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let volg = store.get('lf-volg-v1', {a: [], t: []});
let gelezen = new Set(store.get('lf-gelezen-v1', []));
const saveVolg = () => store.set('lf-volg-v1', volg);
const saveGelezen = () => store.set('lf-gelezen-v1', [...gelezen]);

function chip(pid, sub, extra) {
  const p = PEO[pid]; if (!p) return '';
  return `<a class="chip" href="#persoon-${pid}">${av(pid)}<span class="cn"><b>${esc(p.n)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}${extra ? `<small>${esc(extra)}</small>` : ''}</span></a>`;
}
function extRole(pid) { const p = PEO[pid], r = p.roles[0].r; return p.ext && r.endsWith(', ' + p.ext) ? r.slice(0, -(p.ext.length + 2)) : r; }
function av(pid, size) {
  const p = PEO[pid], st = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size / 3)}px;` : '';
  return p.img ? `<span class="av ph" style="${st}background-image:url('${p.img}')" role="img" aria-label="Foto van ${esc(p.n)}"></span>`
               : `<span class="av" style="${st}--h:${hue(pid)}">${esc(initials(p.n))}</span>`;
}
const vacChip = role => `<span class="chip vac"><span class="av">?</span><span class="cn"><b>Vacature</b><small>${esc(role)}</small></span></span>`;
const idea = key => `<button class="idea" data-idea="${key}" aria-label="Wat kan hier later">✨</button>`;
const pill = f => `<span class="pill f${f}">${esc(D.fase[f])}</span>`;
const areaLink = id => `<a class="tlink" href="#gebied-${id}">${esc(A[id].n)}</a>`;
const themeLink = id => `<a class="tlink" href="#thema-${id}">${esc(T[id].n)}</a>`;
const projectsIn = aid => D.projects.filter(p => p.a.includes(aid));
const sigsFor = (f) => D.signals.filter(f);
const isFollowedSig = s => s.a.some(a => volg.a.includes(a)) || s.th.some(t => volg.t.includes(t));

function pcard(p) {
  const c = PEO[p.c];
  return `<a class="pcard" href="#project-${p.id}"><div class="t"><b>${esc(p.t)}</b>${pill(p.f)}</div><div class="s"><span class="own">${esc(p.own)}</span>${p.th.map(t => esc(T[t].n)).join(', ')}. Contact: ${esc(c.n)}</div></a>`;
}
function sigHTML(s, opts = {}) {
  const unread = !gelezen.has(s.id);
  const where = s.a.map(a => A[a].n).join(', ');
  return `<div class="sig ${unread ? 'unread' : ''}" data-sig="${s.id}"><div class="ic" aria-hidden="true">${ICON[s.type] || '•'}</div><div>
    <div class="h">${esc(s.t)}</div>
    <div class="m">${esc(s.w)}${where ? ', ' + esc(where) : ''}</div>
    <div class="sx">${esc(s.x)}</div>
    ${s.s ? `<div class="tip">${esc(s.s)}</div>` : ''}
    ${s.pr && !opts.noProject ? `<a class="lk" href="#project-${s.pr}">Naar het project</a>` : ''}
  </div></div>`;
}
function followBtn(kind, id, label) {
  const on = (kind === 'a' ? volg.a : volg.t).includes(id);
  return `<button class="follow" data-follow="${kind}:${id}" aria-pressed="${on}">${on ? '✓ Je volgt dit' : '+ Volg ' + esc(label)}</button>`;
}

/* ---------- kaart ---------- */
function drawMap() {
  const svg = $('#map');
  let h = '';
  h += `<rect x="0" y="0" width="26" height="510" fill="var(--sea)"/>`;
  h += `<text x="16" y="150" transform="rotate(-90 16 150)" font-size="11" fill="var(--ink-2)" text-anchor="middle">Noordzee</text>`;
  h += `<path d="M 20 296 C 150 296, 360 304, 470 322 S 690 342, 820 330 S 940 318, 1000 333" fill="none" stroke="var(--water)" stroke-width="28" stroke-linecap="butt"/>`;
  h += `<text x="300" y="304" font-size="11" fill="var(--water-ink)" text-anchor="middle" font-style="italic">Nieuwe Maas</text><text x="925" y="330" font-size="11" fill="var(--water-ink)" text-anchor="middle" font-style="italic">Nieuwe Maas</text>`;
  for (const [t, x, y] of [['Maassluis',240,262],['Vlaardingen',330,262],['Schiedam',384,232],['Capelle a/d IJssel',902,262],['Barendrecht',700,478],['Ridderkerk',955,478],['Spijkenisse',230,500]])
    h += `<text x="${x}" y="${y}" font-size="11" fill="var(--ink-2)" text-anchor="middle" font-style="italic" opacity=".8">${t}</text>`;
  for (const a of D.areas) {
    const n = projectsIn(a.id).length;
    const unread = D.signals.some(s => s.a.includes(a.id) && !gelezen.has(s.id));
    const cy = a.y + a.h / 2, lines = a.lab, lh = 15, y0 = cy - (lines.length - 1) * lh / 2 + 4;
    h += `<g class="tile" data-area="${a.id}" tabindex="0" role="button" aria-label="${esc(a.n)}${n ? ', ' + n + ' projecten' : ''}" style="--c:var(--${a.cl})">
      <rect class="b" x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="10"/>
      ${lines.map((l, i) => `<text x="${a.x + a.w / 2}" y="${y0 + i * lh}" text-anchor="middle">${esc(l)}</text>`).join('')}
      ${n ? `<circle class="pc" cx="${a.x + a.w - 4}" cy="${a.y + 4}" r="10"/><text class="pct" x="${a.x + a.w - 4}" y="${a.y + 8}" text-anchor="middle">${n}</text>` : ''}
      ${unread ? `<circle class="sd" cx="${a.x + 4}" cy="${a.y + 4}" r="6"/>` : ''}
    </g>`;
  }
  svg.innerHTML = h;
}
function setMap(sel, hl) {
  const svg = $('#map');
  svg.classList.toggle('dimming', !!(hl && hl.length));
  svg.querySelectorAll('.tile').forEach(g => {
    const id = g.dataset.area;
    g.classList.toggle('sel', id === sel);
    g.classList.toggle('hl', !!(hl && hl.includes(id)));
  });
  document.querySelectorAll('#arealist a').forEach(a => a.classList.toggle('on', a.dataset.area === sel));
}
function drawLegend() {
  const c = D.clusters;
  $('#legend').innerHTML = ['nb','ni','zi','zb'].map(k => `<span class="k"><i style="background:var(--${k})"></i>${esc(c[k].n)}</span>`).join('')
    + `<span class="k"><span class="num">2</span>projecten</span><span class="k"><span class="dot"></span>nieuw signaal</span>`;
  $('#arealist').innerHTML = D.areas.map(a => `<a href="#gebied-${a.id}" data-area="${a.id}">${esc(a.n)}</a>`).join('');
}

/* ---------- weergaven ---------- */
function vIntro() {
  const latest = D.signals.filter(isFollowedSig).concat(D.signals.filter(s => !isFollowedSig(s))).slice(0, 4).map(s => sigHTML(s)).join('');
  return `<div class="hero"><h1>Vindt en verbindt.</h1>
    <p>Zoek een gebied, thema of collega. Je ziet wie ermee bezig is, wat er speelt en wat er verandert, en je kunt het volgen.</p>
    <div class="acts"><a class="btn pri" href="#gebied-hvh">Bekijk Hoek van Holland</a><a class="btn" href="#themas">Bekijk de thema’s</a><button class="btn" data-open="drawer">Open de meldingen</button></div></div>
    <div class="sec"><h3>Laatste signalen ${volg.a.length + volg.t.length ? '<span class="cnt">wat je volgt staat bovenaan</span>' : ''} ${idea('documenten')}</h3>${latest}</div>
    <details class="keep"><summary>Hoe blijft dit actueel? ${idea('bijhouden')}</summary>
      <ul>
        <li><b>Niets dubbel invoeren.</b> De tool leest mee met lijsten die al bestaan, en niemand houdt een tweede lijst bij.</li>
        <li><b>Eén keer per jaar:</b> het werkprogramma en de activiteitenlijst inladen. Dan zijn de thema’s, trekkers en activiteiten bij.</li>
        <li><b>Gebiedsteams:</b> de gebiedsverdeling die de gebiedssecretaris al bijhoudt, is de bron.</li>
        <li><b>Nieuwe en vertrokken collega’s:</b> bij een accountaanvraag of vertrek krijgt het secretariaat een kant-en-klaar voorstel om goed te keuren.</li>
        <li><b>Projecten en documenten:</b> de lokale AI ziet wijzigingen in teammappen en stelt voor wat er moet veranderen. Een mens keurt goed met één klik.</li>
        <li><b>Twee keer per jaar</b> krijgt iedereen de vraag “klopt je profiel nog?”, met één klik voor “ja”.</li>
      </ul></details>`;
}

function vArea(a) {
  const c = D.clusters[a.cl];

  const ss = sigsFor(s => s.a.includes(a.id));
  const kk = ['hvh','rozenburg','pernis'].includes(a.id) ? D.org.weth.find(w => w.r.includes('kleine kernen')) : null;
  return `<p class="crumb"><a href="#kaart">Gebieden</a> / ${esc(c.n)}</p>
  <div class="ph"><h2>${esc(a.n)}</h2>${followBtn('a', a.id, 'gebied')}</div>
  <div class="meta"><span>${esc(c.team)}, teamleider <a href="#persoon-${a.tl}">${esc(PEO[a.tl].n)}</a></span><span>Uren gebiedswerk op <b>${esc(a.code)}</b></span>${kk ? `<span>Wethouder kleine kernen: <a href="#persoon-${kk.p}">${esc(kk.n)}</a> (beoogd)</span>` : ''}</div>
  <div class="sec"><h3>Wat speelt er <span class="cnt">${ps.length} ${ps.length === 1 ? 'project' : 'projecten'}</span> ${idea('status')}</h3>
    ${ps.length ? `<div class="cards">${ps.map(pcard).join('')}</div>` : `<div class="empty">Voor dit gebied zijn nog geen projecten ingevoerd. Later vult de assistent dit aan uit documenten die over ${esc(a.n)} gaan. ${idea('documenten')}</div>`}</div>
  <div class="sec"><h3>Gebiedsteam</h3><div class="chips">${a.team.map(t => t.vac ? vacChip(t.r) : chip(t.p, t.r + (t.note ? ' (' + t.note + ')' : ''))).join('')}</div></div>
  <div class="sec"><h3>Wat verandert er <span class="cnt">${ss.length}</span> ${idea('documenten')}</h3>
    ${ss.length ? `<div id="siglist">${ss.map((s, i) => i < 3 ? sigHTML(s) : sigHTML(s).replace('class="sig', 'hidden class="sig')).join('')}</div>${ss.length > 3 ? `<button class="morebtn" data-more="siglist">Toon alle ${ss.length} signalen</button>` : ''}` : `<div class="empty">Geen nieuwe signalen. Volg dit gebied, dan hoor je het als er iets verandert.</div>`}</div>
  <div class="sec"><h3>Aanspreekpunten per thema</h3><div class="rows">${a.thema.map(t => `<div class="row"><span>${esc(t.r)}</span><div>${chip(t.p, t.note || '')}</div></div>`).join('')}</div></div>
  <div class="sec"><h3>Gebied in cijfers ${idea('cijfers')}</h3><div class="empty">Hier komt het gebiedsprofiel met cijfers per thema, zoals het gebruik van deelmobiliteit, meldingen en pakketpunten. ${chip('kevin-su', 'liet een eerste gebiedsprofiel zien')}</div></div>
  <div class="sec"><h3>Je vindt dit gebied ook via</h3><div class="kw">${a.kw.map(k => `<span>${esc(k)}</span>`).join('')}</div></div>`;
}

function vProject(p) {
  const ss = sigsFor(s => s.pr === p.id);
  return `<p class="crumb"><a href="#kaart">Gebieden</a> / project</p>
  <div class="ph"><h2>${esc(p.t)}</h2></div>
  <div class="meta"><span>Opdrachtgever <b>${esc(p.own)}</b></span>${p.own !== 'SO Mobiliteit' ? '<span>Mobiliteit adviseert</span>' : ''}</div>
  <div class="fase" aria-hidden="true">${D.fase.map((f, i) => `<div class="${i < p.f ? 'done' : i === p.f ? 'now' : ''}"></div>`).join('')}</div>
  <div class="faselab">${D.fase.map((f, i) => `<span class="${i === p.f ? 'now' : ''}">${esc(f)}</span>`).join('')}</div>
  <p style="font-size:13px;color:var(--ink-2);margin:6px 0 0">Fase volgens het Openbare Ruimte Proces ${idea('status')}</p>
  <p style="font-size:17px;margin:16px 0 0">${esc(p.d)}</p>
  <div class="sec"><h3>Contactpersoon</h3><div class="chips">${chip(p.c, rolesShort(p.c))}</div></div>
  ${p.b.length ? `<div class="sec"><h3>Ook betrokken</h3><div class="chips">${p.b.map(b => chip(b, rolesShort(b))).join('')}</div></div>` : ''}
  <div class="sec"><h3>Gebied${p.a.length > 1 ? 'en' : ''} en thema’s</h3><div class="chips">${p.a.map(a => `<a class="chip" href="#gebied-${a}" style="padding-left:12px"><b>${esc(A[a].n)}</b></a>`).join('')}${p.th.map(t => `<a class="chip" href="#thema-${t}" style="padding-left:12px;background:var(--pill)"><b>${esc(T[t].n)}</b></a>`).join('')}</div></div>
  <div class="sec"><h3>Signalen <span class="cnt">${ss.length}</span></h3>${ss.length ? ss.map(s => sigHTML(s, {noProject: true})).join('') : '<div class="empty">Nog geen signalen over dit project.</div>'}</div>

function rolesShort(pid) {
  const r = PEO[pid].roles;
  if (!r.length) return '';
  const first = r[0];
  return first.r + (first.a ? ' ' + A[first.a].n : '') + (r.length > 1 ? ' en meer' : '');
}

function vPerson(pid) {
  const p = PEO[pid];
  const ps = D.projects.filter(x => x.c === pid || x.b.includes(pid));
  const areas = [...new Set(p.roles.filter(r => r.a).map(r => r.a).concat(ps.flatMap(x => x.a)))];
  const themes = [...new Set(p.roles.filter(r => r.t).map(r => r.t).concat(ps.flatMap(x => x.th)))];
  // rollen samenvoegen: zelfde rol over meerdere gebieden
  const grouped = {};
  for (const r of p.roles) {
    const key = r.r + (r.t && !r.a ? '|' + r.t : '');
    (grouped[key] = grouped[key] || {r: r.r, a: [], t: r.t && !r.a ? r.t : null}).a.push(r.a);
  }
  const roleLines = Object.values(grouped).map(g => {
    const as = g.a.filter(Boolean);
    let s = esc(g.r);
    if (g.t) s += ' bij ' + themeLink(g.t);
    if (as.length) s += as.length > 4 ? ` in ${as.length} gebieden` : ' in ' + as.map(areaLink).join(', ');
    return `<li>${s}</li>`;
  }).join('');
  return `<p class="crumb"><a href="#organisatie">${p.ext ? 'Externe contacten' : 'Collega’s'}</a>${p.ext ? ' / ' + esc(p.ext) : ''}</p>
  <div class="ph" style="justify-content:flex-start;align-items:center">${av(pid, 72)}<h2>${esc(p.n)}</h2></div>
  ${p.bz ? `<p style="font-size:16px;max-width:42em;margin:10px 0 0">${esc(p.bz)}</p>` : ''}
  <div class="sec"><h3>Rollen</h3>${roleLines ? `<ul class="acts-list">${roleLines}</ul>` : '<div class="empty">Nog geen rol bekend. Projectrollen staan hieronder.</div>'}</div>
  ${ps.length ? `<div class="sec"><h3>Projecten <span class="cnt">${ps.length}</span></h3><div class="cards">${ps.map(pcard).join('')}</div></div>` : ''}
  ${themes.length ? `<div class="sec"><h3>Thema’s</h3><div class="chips">${themes.map(t => `<a class="chip" href="#thema-${t}" style="padding-left:12px;background:var(--pill)"><b>${esc(T[t].n)}</b></a>`).join('')}</div></div>` : ''}
  <div class="sec acts"><button class="btn" data-teams="${esc(p.n)}">Stuur een Teams-bericht</button>${idea('persoon')}</div>`;
}

function vTheme(t) {
  const ps = D.projects.filter(p => p.th.includes(t.id));
  const ss = sigsFor(s => s.th.includes(t.id));
  const areas = [...new Set(ps.flatMap(p => p.a).concat(ss.flatMap(x => x.a)))];
  const ext = (D.org.ext || []).filter(e => e.th === t.id);
  const acts = t.acts;
  return `<p class="crumb"><a href="#themas">Thema’s</a> / ${esc(t.team)}</p>
  <div class="ph"><h2>${esc(t.n)}</h2>${followBtn('t', t.id, 'thema')}</div>
  <div class="twocol"><div>
  <div class="sec"><h3>Thematrekkers</h3><div class="chips">${t.tr.map(p => chip(p, (PEO[p].roles.find(r => r.t === t.id && !r.a) || {}).r || '')).join('')}</div></div>
  ${ext.map(e => `<div class="sec"><h3>Externe contacten, ${esc(e.org)}</h3><div class="chips">${e.m.map(p => chip(p, extRole(p))).join('')}</div></div>`).join('')}
  <div class="sec"><h3>Speelt in deze gebieden <span class="cnt">${areas.length}</span></h3>${areas.length ? `<div class="chips">${areas.map(a => `<a class="chip" href="#gebied-${a}" style="padding-left:12px"><b>${esc(A[a].n)}</b></a>`).join('')}</div>` : '<div class="empty">Nog geen gebieden gekoppeld.</div>'}</div>
  <div class="sec"><h3>Projecten <span class="cnt">${ps.length}</span></h3>${ps.length ? `<div class="cards">${ps.map(pcard).join('')}</div>` : '<div class="empty">Nog geen gebiedsprojecten gekoppeld aan dit thema.</div>'}</div>
  ${ss.length ? `<div class="sec"><h3>Signalen <span class="cnt">${ss.length}</span></h3>${ss.map(s => sigHTML(s)).join('')}</div>` : ''}
  </div><div>
  <div class="sec"><h3>Uit het werkprogramma <span class="cnt">${t.nacts} activiteiten</span></h3>
    <p style="margin:0 0 10px;font-size:14px;color:var(--ink-2)">Uit de activiteitenlijst van het werkprogramma Mobiliteit, met het jaar en de trekker. De lijst noemt geen gebieden, daarom staan deze activiteiten niet op de kaart.</p>
    <ul class="acts-list" id="actlist">${acts.map((a, i) => `<li ${i >= 8 ? 'hidden' : ''}>${esc(a.a)} <small>(${esc(a.j)}${a.p && PEO[a.p] ? ', <a href="#persoon-' + a.p + '">' + esc(PEO[a.p].n) + '</a>' : ''})</small></li>`).join('')}</ul>
    ${acts.length > 8 ? `<button class="morebtn" data-more="actlist">Toon alle ${acts.length}</button>` : ''}</div>
  </div></div>`;
}

/* ---------- router ---------- */
function route(keep) {
  const h = decodeURIComponent(location.hash.slice(1)) || 'kaart';
  const [kind, ...rest] = h.split('-'); const id = rest.join('-');
  const layout = $('#layout'), panel = $('#panel');
  let tab = 'kaart', html = '', full = false, sel = null, hl = [];
  if (kind === 'gebied' && A[id]) { html = vArea(A[id]); sel = id; }
  else if (kind === 'project' && P[id]) { html = vProject(P[id]); hl = P[id].a; }
  else if (kind === 'persoon' && PEO[id]) {
    html = vPerson(id);
    hl = [...new Set(PEO[id].roles.filter(r => r.a).map(r => r.a).concat(D.projects.filter(x => x.c === id || x.b.includes(id)).flatMap(x => x.a)))];
  }
  else if (kind === 'thema' && T[id]) { html = vTheme(T[id]); tab = 'themas'; full = true; }
  else if (h === 'themas') { html = vThemes(); tab = 'themas'; full = true; }
  else if (h === 'organisatie') { html = vOrg(); tab = 'organisatie'; full = true; }
  else { html = vIntro(); }
  layout.classList.toggle('full', full);
  panel.innerHTML = html;
  setMap(sel, hl);
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  hidePop();
  if (!keep && h !== 'kaart') {
    if (window.innerWidth <= 960 && !full) panel.scrollIntoView({block: 'start'});
    else window.scrollTo({top: 0});
  }
}

/* ---------- zoeken ---------- */
const INDEX = [];
for (const a of D.areas) INDEX.push({type: 'Gebied', o: 1, label: a.n, hash: 'gebied-' + a.id, terms: [a.n, ...a.kw], sub: D.clusters[a.cl].n});
for (const t of D.themes) INDEX.push({type: 'Thema', o: 2, label: t.n, hash: 'thema-' + t.id, terms: [t.n, ...t.syn], sub: t.tr.map(p => PEO[p].n).join(', ')});
for (const p of D.projects) INDEX.push({type: 'Project', o: 3, label: p.t, hash: 'project-' + p.id, terms: [p.t, ...p.a.map(a => A[a].n)], sub: p.a.map(a => A[a].n).join(', ')});
for (const p of Object.values(PEO)) INDEX.push({type: p.ext ? 'Extern' : 'Collega', o: 4, label: p.n, hash: 'persoon-' + p.id, terms: [p.n].concat(p.ext ? p.roles.map(x => x.r) : []), sub: p.ext ? extRole(p.id) + ', ' + p.ext : rolesShort(p.id)});
INDEX.forEach(e => e.nt = e.terms.map(norm));

let cur = -1, hits = [];
function search(q) {
  const box = $('#results'), nq = norm(q.trim());
  if (nq.length < 2) { box.hidden = true; return; }
  hits = [];
  for (const e of INDEX) {
    let best = 0, via = null;
    e.nt.forEach((t, i) => {
      let s = 0;
      if (t === nq) s = 5; else if (t.startsWith(nq)) s = 4; else if (t.split(/[\s\-/]+/).some(w => w.startsWith(nq))) s = 3; else if (t.includes(nq)) s = 1;
      if (s > best) { best = s; via = i > 0 ? e.terms[i] : null; }
    });
    if (best) hits.push({e, s: best, via});
  }
  hits.sort((x, y) => y.s - x.s || x.e.o - y.e.o || x.e.label.localeCompare(y.e.label));
  hits = hits.slice(0, 10); cur = hits.length ? 0 : -1;
  box.innerHTML = hits.length
    ? hits.map((h, i) => `<button role="option" aria-selected="${i === cur}" data-hash="${h.e.hash}"><span class="ty">${h.e.type}</span><span><span class="lb">${esc(h.e.label)}</span><small>${h.via ? 'gevonden via “' + esc(h.via) + '”' : esc(h.e.sub || '')}</small></span></button>`).join('')
    : `<div class="empty">Niets gevonden voor “${esc(q)}”. Probeer een wijk (Katendrecht), een onderwerp (pakketpunt) of een naam. ${idea('zoeken')}</div>`;
  box.hidden = false;
}
function pick(hash) { $('#results').hidden = true; $('#q').value = ''; $('#q').blur(); location.hash = hash; }

/* ---------- meldingen, volgen, mail ---------- */
let filt = 'mine';
function updateBell() { const n = D.signals.filter(s => !gelezen.has(s.id)).length; $('#bellN').textContent = n || ''; }
function followUI() {
  const chipsF = volg.a.filter(a => A[a]).map(a => `<button data-unf="a:${a}" aria-label="${esc(A[a].n)} niet meer volgen">${esc(A[a].n)} ×</button>`)
    .concat(volg.t.filter(t => T[t]).map(t => `<button data-unf="t:${t}" aria-label="${esc(T[t].n)} niet meer volgen">${esc(T[t].n)} ×</button>`)).join('');
  return `<div class="fchips">${chipsF ? 'Je volgt: ' + chipsF : 'Je volgt nog niets. Kies hieronder een gebied of thema.'}</div>
  <div class="addf"><select id="addA" aria-label="Gebied om te volgen"><option value="">Kies een gebied</option>${D.areas.filter(a => !volg.a.includes(a.id)).map(a => `<option value="${a.id}">${esc(a.n)}</option>`).join('')}</select>
  <select id="addT" aria-label="Thema om te volgen"><option value="">Kies een thema</option>${D.themes.filter(t => !volg.t.includes(t.id)).map(t => `<option value="${t.id}">${esc(t.n)}</option>`).join('')}</select>
  <button class="btn pri" id="addBtn">Volg</button></div>`;
}
function renderDrawer() {
  const mine = D.signals.filter(isFollowedSig), rest = D.signals.filter(s => !isFollowedSig(s));
  $('#fwrap').innerHTML = followUI();
  let html;
  if (filt === 'mine') html = mine.length ? mine.map(s => sigHTML(s)).join('') : '<div class="empty" style="margin-top:12px">Nog geen meldingen voor wat je volgt. Kies hierboven een gebied of thema, bijvoorbeeld Hoek van Holland.</div>';
  else html = (mine.length ? '<p class="dsub">Wat je volgt</p>' + mine.map(s => sigHTML(s)).join('') : '') + (rest.length ? `<p class="dsub">${mine.length ? 'Overige meldingen' : 'Alle meldingen'}</p>` + rest.map(s => sigHTML(s)).join('') : '');
  $('#dbody').innerHTML = html;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filt));
}
function openDrawer() { renderDrawer(); $('#drawer').hidden = false; $('#scrim').hidden = false; $('#drawerX').focus(); }
function closeDrawer() { $('#drawer').hidden = true; $('#scrim').hidden = true; }
function markRead(ids) { ids.forEach(i => gelezen.add(i)); saveGelezen(); updateBell(); drawMap(); route(true); if (!$('#drawer').hidden) renderDrawer(); }

function toggleFollow(kind, id) {
  const arr = kind === 'a' ? volg.a : volg.t;
  const i = arr.indexOf(id), name = kind === 'a' ? A[id].n : T[id].n;
  if (i >= 0) { arr.splice(i, 1); toast(`Je volgt ${name} niet meer.`); }
  else { arr.push(id); toast(`Je volgt nu ${name}. Nieuwe signalen zie je bij het belletje en in de maandmail.`); }
  saveVolg(); route(true); if (!$('#drawer').hidden) renderDrawer();
}

function openModal(title, html) { $('#mtitle').textContent = title; $('#mbody').innerHTML = html; $('#modal').hidden = false; $('#modalX').focus(); }
function closeModal() { $('#modal').hidden = true; }
function mailHTML() {
  let a = volg.a.slice(), t = volg.t.slice(), voorbeeld = false;
  if (!a.length && !t.length) { a = ['hvh']; voorbeeld = true; }
  const sigs = D.signals.filter(s => s.a.some(x => a.includes(x)) || s.th.some(x => t.includes(x)));
  const who = [...new Set(sigs.flatMap(s => s.p))].slice(0, 5);
  const projs = D.projects.filter(p => p.a.some(x => a.includes(x)) || p.th.some(x => t.includes(x))).slice(0, 6);
  const names = a.map(x => A[x].n).concat(t.map(x => T[x].n));
  return `<div class="mail">
    ${voorbeeld ? '<p class="empty" style="margin-top:14px">Je volgt nog niets. Dit voorbeeld laat zien hoe de mail eruitziet als je Hoek van Holland volgt.</p>' : ''}
    <div class="hdr"><span>Van</span><b>Lost &amp; Found, afdeling Mobiliteit</b><span>Aan</span><b>jou</b><span>Onderwerp</span><b>Jouw maandoverzicht november: ${esc(names.join(', '))}</b></div>
    <p>Hoi,</p><p>Dit is er de afgelopen maand veranderd in wat je volgt.</p>
    <h3>Wat er veranderde</h3><ul>${sigs.map(s => `<li>${esc(s.t)} <small style="color:var(--ink-2)">(${esc(s.w)})</small></li>`).join('') || '<li>Niets nieuws deze maand.</li>'}</ul>
    ${who.length ? `<h3>Misschien goed om te spreken</h3><div class="chips">${who.map(p => chip(p, rolesShort(p))).join('')}</div>` : ''}
    <h3>Wat er speelt</h3><ul>${projs.map(p => `<li><a href="#project-${p.id}" data-close>${esc(p.t)}</a>, ${esc(D.fase[p.f].toLowerCase())}</li>`).join('')}</ul>
    <p style="margin-top:18px;color:var(--ink-2);font-size:14px">Je krijgt deze mail omdat je dit volgt in Lost &amp; Found. Volgen aanpassen kan op de pagina van het gebied of thema.</p>
    <div class="acts">${idea('maandmail')}</div></div>`;
}

/* ---------- ideeën ---------- */
const IDEAS = {
  kaart: ['Echte kaart met lagen', 'De echte gebieds- en wijkgrenzen uit de gemeentelijke GIS, met lagen voor werkzaamheden (klikmeldingen, meerjarenplan Stadsbeheer), VRI’s en andere spullen van verkeersmanagement en de deelmobiliteitsdata.', 'Nu: een schematische kaart met de gebieden van Mobiliteit.'],
  zoeken: ['Vragen in gewone taal', 'Stel een vraag als “wat speelt er rond pakketpunten in Hoek van Holland?”. De lokale AI van de gemeente zoekt in de documenten en antwoordt met bron en contactpersoon.', 'Nu: zoeken op trefwoord, met een lijst wijken, straten en synoniemen.'],
  documenten: ['Signalen uit documenten', 'Verandert er een document in Teams, SharePoint of Diva dat over een gebied of thema gaat, dan herkent de AI dat en seint de mensen die het volgen. Bij vertrouwelijke stukken laat de tool alleen zien wie er werkt en waar, niet de inhoud.', 'Nu: voorbeeldsignalen, met de gevallen uit het gesprek van team Lost & Found.'],
  status: ['Status automatisch', 'De AI leest de fase uit de projectadministratie en het laatste document en stelt een status voor. De projectleider bevestigt met één klik.', 'Nu: een voorbeeldstatus per project.'],
  bijhouden: ['Bijhouden zonder extra werk', 'De tool leest uit bronnen die er al zijn: het werkprogramma één keer per jaar, de gebiedsverdeling van de gebiedssecretaris, accountaanvragen bij in- en uitstroom en wijzigingen in documenten. De AI stelt voor, een mens keurt goed.', 'Nu: ingeladen uit de bestanden van vandaag.'],
  meldingen: ['Meldingen zonder account', 'Iedereen logt al in met het gemeente-account. Wat je volgt, staat dan in een eenvoudige lijst, en meldingen komen via Teams of als maandmail.', 'Nu: wat je volgt, wordt alleen in deze browser onthouden.'],
  maandmail: ['Maandmail door AI', 'Elke maand een korte samenvatting per gebied en thema dat je volgt, met wie je zou moeten spreken. Het clusteroverleg kan dit als vast agendapunt gebruiken.', 'Nu: een voorbeeldmail op basis van wat je volgt.'],
  persoon: ['Rijker profiel', 'Expertise, lopende projecten en, voor wie wil, hobby’s: wie speelt er ook klarinet? En direct een Teams-bericht sturen vanuit het profiel.', 'Nu: rollen uit de gebiedsverdeling en de activiteitenlijst.'],
  cijfers: ['Gebied in cijfers', 'Per gebied de stand per thema, zoals gebruik van deelmobiliteit en hubs, meldingen, pakketpunten en laadpalen. Collega’s in de wijk zien het zelf, zonder het te hoeven vragen.', 'Nu: nog niet gekoppeld.'],
  organisatie: ['Breder dan Mobiliteit', 'Stadsbeheer, ROA, Gebiedsontwikkeling en Maatschappelijke Ontwikkeling toevoegen, plus externe contacten zoals POLIS en Natuurlijk!Deelmobiliteit. Ook overleggen per gebied (POB, TOR, GOB) met datum, zodat je kunt aansluiten.', 'Nu: alleen de afdeling Mobiliteit, met daarboven directie en wethouders.'],
};
function showPop(btn, key) {
  const [t, x, nu] = IDEAS[key] || ['', '', ''];
  const pop = $('#pop');
  pop.innerHTML = `<b>${esc(t)}</b><p>${esc(x)}</p><p class="nu">${esc(nu)}</p><button data-allideas>Alle ideeën op een rij</button>`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(8, r.left + r.width / 2 - pw / 2), window.innerWidth - pw - 8);
  let top = r.bottom + 10; if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 10);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function hidePop() { $('#pop').hidden = true; }
function allIdeasHTML() {
  return `<div class="ideas-all">${Object.values(IDEAS).map(([t, x, nu]) => `<h3>✨ ${esc(t)}</h3><p>${esc(x)}</p><p style="color:var(--ink-2);font-size:13px;margin-top:2px">${esc(nu)}</p>`).join('')}</div>`;
}

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3600); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a, .tile');
  if (!e.target.closest('#pop') && !e.target.closest('.idea')) hidePop();
  if (!e.target.closest('.search')) $('#results').hidden = true;
  if (!t) return;
  if (t.classList.contains('idea')) { e.preventDefault(); e.stopPropagation(); showPop(t, t.dataset.idea); return; }
  if (t.matches('[data-allideas]')) { hidePop(); openModal('Wat kan er later nog meer', allIdeasHTML()); return; }
  if (t.classList.contains('tile')) { location.hash = 'gebied-' + t.dataset.area; return; }
  if (t.dataset.follow) { const [k, id] = t.dataset.follow.split(':'); toggleFollow(k, id); return; }
  if (t.dataset.open === 'drawer') { openDrawer(); return; }
  if (t.dataset.more) { document.querySelectorAll('#' + t.dataset.more + ' [hidden]').forEach(li => li.hidden = false); t.remove(); return; }
  if (t.dataset.teams) { toast('In het prototype gaat er geen bericht weg. Later opent dit een Teams-chat met ' + t.dataset.teams + '.'); return; }
  if (t.dataset.hash) { pick(t.dataset.hash); return; }
  if (t.dataset.f) { filt = t.dataset.f; renderDrawer(); return; }
  if (t.dataset.unf) { const [k, id] = t.dataset.unf.split(':'); toggleFollow(k, id); return; }
  if (t.id === 'addBtn') {
    const a = $('#addA').value, th = $('#addT').value;
    if (!a && !th) { toast('Kies eerst een gebied of een thema.'); return; }
    if (a) toggleFollow('a', a); if (th) toggleFollow('t', th); return;
  }
  if (t.matches('a[href^="#"]')) {
    if (t.closest('#modal')) closeModal();
    if (t.closest('#drawer')) { const s = t.closest('.sig'); if (s) markRead([s.dataset.sig]); closeDrawer(); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hidePop(); closeModal(); closeDrawer(); $('#results').hidden = true; }
  const tile = e.target.closest && e.target.closest('.tile');
  if (tile && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); location.hash = 'gebied-' + tile.dataset.area; }
});
$('#q').addEventListener('input', e => search(e.target.value));
$('#q').addEventListener('focus', e => { if (e.target.value) search(e.target.value); });
$('#q').addEventListener('keydown', e => {
  const btns = [...document.querySelectorAll('#results button')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!btns.length) return;
    cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.setAttribute('aria-selected', i === cur)); btns[cur].scrollIntoView({block: 'nearest'});
  } else if (e.key === 'Enter' && hits[cur]) { e.preventDefault(); pick(hits[cur].e.hash); }
});
$('#bellBtn').addEventListener('click', openDrawer);
$('#drawerX').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);
$('#readAll').addEventListener('click', () => markRead(D.signals.map(s => s.id)));
$('#mailBtn').addEventListener('click', () => openModal('Voorbeeld van de maandmail', mailHTML()));
$('#modalX').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#ideasBtn').addEventListener('click', e => {
  const on = !document.body.classList.contains('ideas');
  document.body.classList.toggle('ideas', on);
  e.currentTarget.setAttribute('aria-pressed', on);
  hidePop();
  if (on) toast('Klik op een ✨ om te zien wat daar later nog kan.');
});
window.addEventListener('hashchange', () => route());
window.addEventListener('resize', hidePop);

drawMap(); drawLegend(); updateBell(); route();
</script>
